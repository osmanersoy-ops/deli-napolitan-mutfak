<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deli Napolitan - Fırın Ekranı</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @keyframes pulse-urgent {
      0%, 100% { border-color: #ef4444; background-color: #fef2f2; }
      50% { border-color: #dc2626; background-color: #fee2e2; }
    }
    .card-urgent {
      animation: pulse-urgent 2s infinite ease-in-out;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .order-enter {
      animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .order-exit {
      transform: scale(0.92) translateY(24px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#f1f5f9] text-slate-800 min-h-screen font-sans antialiased select-none flex flex-col">

  <!-- TOP BAR: SADECE FULL EKRAN BUTONU -->
  <header class="px-6 py-2.5 flex items-center justify-end sticky top-0 z-30 bg-transparent">
    <button onclick="toggleFullScreen()" title="Tam Ekran Modu" class="flex items-center gap-2 px-3.5 py-2 bg-white hover:bg-slate-50 border border-slate-300 rounded-xl text-slate-800 shadow-sm transition active:scale-95 text-sm font-bold">
      <span>⛶</span>
      <span>Tam Ekran</span>
    </button>
  </header>

  <!-- MAIN KDS GRID (Landscape Samsung Tablet) -->
  <main class="flex-1 px-6 pb-6 overflow-y-auto">
    <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-5 items-start">
      <!-- Kartlar FIFO sıralamasıyla buraya basılır -->
    </div>

    <!-- Boş Durum -->
    <div id="empty-state" class="hidden text-center py-36">
      <div class="text-7xl mb-3">🍕</div>
      <h3 class="text-2xl font-black text-slate-800">Bekleyen Pizza Yok</h3>
      <p class="text-sm text-slate-500 mt-1">Adisyo'dan sipariş girildiğinde buraya otomatik düşecektir.</p>
    </div>
  </main>

  <script>
    let soundEnabled = true;
    let audioCtx = null;
    let orders = [];

    // Web Audio Mutfak Zili (İki tonlu parlak ses)
    function playKitchenChime() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(987.77, now);
        osc1.frequency.exponentialRampToValueAtTime(1318.51, now + 0.08);
        gain1.gain.setValueAtTime(0.4, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.5);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1567.98, now + 0.12);
        gain2.gain.setValueAtTime(0.35, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.85);
      } catch (e) {
        console.log("Audio notice:", e);
      }
    }

    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // Kartları Ekrana Bas (FIFO Sıralaması: En eski sipariş en başta)
    function renderOrders() {
      const container = document.getElementById('orders-grid');
      const emptyState = document.getElementById('empty-state');

      if (!orders || orders.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // İlk gelen (en uzun süredir bekleyen) en başta durur
      orders.sort((a, b) => b.secondsElapsed - a.secondsElapsed);

      container.innerHTML = orders.map((order) => {
        let timerBg = "bg-emerald-50 text-emerald-700 border-emerald-300";
        let cardBorder = "border-slate-300";
        let cardBg = "bg-white";
        let headerBg = "bg-slate-50";
        let isUrgent = false;

        if (order.secondsElapsed >= 600) { // 10+ dk
          timerBg = "bg-red-600 text-white border-red-700 animate-pulse font-black shadow-sm";
          cardBorder = "border-red-500 shadow-lg card-urgent";
          headerBg = "bg-red-50/80";
          isUrgent = true;
        } else if (order.secondsElapsed >= 300) { // 5-10 dk
          timerBg = "bg-amber-100 text-amber-900 border-amber-400 font-bold";
          cardBorder = "border-amber-400 shadow-md";
          headerBg = "bg-amber-50/60";
        }

        const isPack = order.orderType === "PAKET";

        return `
          <div id="card-${order.id}" class="order-enter ${cardBg} rounded-2xl border-2 ${cardBorder} shadow-sm overflow-hidden flex flex-col">
            
            <!-- KART BAŞLIĞI -->
            <div class="${headerBg} px-4 py-3 border-b-2 border-slate-200 flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-[11px] font-black uppercase px-2 py-0.5 rounded ${isPack ? 'bg-purple-600 text-white' : 'bg-slate-900 text-white'}">
                    ${order.orderType}
                  </span>
                  <span class="text-xs font-bold text-slate-500">#${order.orderNumber}</span>
                </div>
                <h2 class="text-xl font-black text-slate-900 mt-1 leading-snug tracking-tight">
                  ${order.tableName}
                </h2>
              </div>

              <!-- CANLI SAYAÇ -->
              <div class="flex flex-col items-end shrink-0">
                <div class="px-2.5 py-1 rounded-lg text-base font-mono font-black border ${timerBg} flex items-center gap-1">
                  <span class="text-xs">⏱</span>
                  <span id="timer-${order.id}">${formatTime(order.secondsElapsed)}</span>
                </div>
                ${isUrgent ? '<span class="text-[10px] font-black text-red-600 uppercase tracking-wider mt-0.5">GECİKİYOR!</span>' : ''}
              </div>
            </div>

            <!-- PİZZA LİSTESİ -->
            <div class="p-4 flex-1 flex flex-col gap-3.5 divide-y divide-slate-100">
              ${order.pizzas.map((pizza) => `
                <div class="pt-3 first:pt-0">
                  <div class="flex items-baseline gap-2.5">
                    <span class="text-2xl font-black text-red-600 leading-none shrink-0">${pizza.qty}x</span>
                    <span class="text-xl font-extrabold text-slate-900 tracking-tight leading-tight">
                      ${pizza.name}
                    </span>
                  </div>

                  <!-- ÜRÜN NOTU -->
                  ${pizza.note ? `
                    <div class="mt-2 ml-7 inline-flex items-center gap-1.5 bg-rose-50 border-2 border-rose-300 text-rose-900 px-3 py-1 rounded-lg text-xs font-black tracking-wide shadow-sm">
                      <span class="text-sm">⚠️</span>
                      <span>${pizza.note}</span>
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>

          </div>
        `;
      }).join('');
    }

    // Sipariş Hazırlandı animasyonu ve düşürme
    function animateAndRemoveOrder(orderId) {
      const card = document.getElementById(`card-${orderId}`);
      if (card) {
        card.classList.remove('card-urgent');
        card.classList.add('bg-emerald-50', 'border-emerald-500');
        card.innerHTML = `
          <div class="p-8 text-center flex flex-col items-center justify-center my-auto">
            <div class="w-12 h-12 rounded-full bg-emerald-600 text-white flex items-center justify-center text-2xl font-black mb-2 shadow-md">✓</div>
            <div class="text-lg font-black text-emerald-900">Adisyo'da Hazırlandı!</div>
          </div>
        `;
        
        setTimeout(() => {
          card.classList.add('order-exit');
          setTimeout(() => {
            orders = orders.filter(o => o.id !== orderId);
            renderOrders();
          }, 350);
        }, 400);
      } else {
        orders = orders.filter(o => o.id !== orderId);
        renderOrders();
      }
    }

    // --- SOCKET.IO BAĞLANTISI ---
    try {
      const socket = io();

      // Sunucuya bağlanınca mevcut tüm siparişleri al
      socket.on('orders_init', (initialOrders) => {
        orders = initialOrders || [];
        renderOrders();
      });

      // Yeni pizza siparişi geldiğinde
      socket.on('order_created', (newOrder) => {
        const existingIdx = orders.findIndex(o => o.id === newOrder.id);
        if (existingIdx !== -1) {
          orders[existingIdx] = newOrder;
        } else {
          orders.push(newOrder);
          playKitchenChime();
        }
        renderOrders();
      });

      // Adisyo'da hazır basıldığında veya sipariş kapandığında
      socket.on('order_removed', (data) => {
        animateAndRemoveOrder(data.id);
      });
    } catch (e) {
      console.warn("Socket.io bağlantısı kurulamadı (Geliştirme / Test modunda çalışıyor olabilir)");
    }

    // Canlı Sayaç Güncelleme
    setInterval(() => {
      orders.forEach(order => {
        order.secondsElapsed += 1;
        const timerEl = document.getElementById(`timer-${order.id}`);
        if (timerEl) {
          timerEl.textContent = formatTime(order.secondsElapsed);
        }
      });
    }, 1000);

    // Tam Ekran
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Klavye kısayolları (Test amaçlı): N = Yeni Sipariş, H / Space = Hazırla Düşür
    window.addEventListener('keydown', (e) => {
      if (e.key === 'n' || e.key === 'N') {
        fetch('/api/test/new-order', { method: 'POST' }).catch(() => {});
      } else if (e.key === 'h' || e.key === 'H' || e.code === 'Space') {
        fetch('/api/test/drop-order', { method: 'POST' }).catch(() => {});
      }
    });

    // İlk çizim
    renderOrders();
  </script>
</body>
</html>
