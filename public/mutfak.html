<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deli Napolitan - Mutfak Fırın Ekranı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-red {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.35); }
      50% { border-color: #b91c1c; box-shadow: 0 0 25px rgba(220, 38, 38, 0.6); }
    }
    .card-urgent {
      animation: pulse-red 1.6s infinite ease-in-out;
    }
    @keyframes slide-in-left {
      from { opacity: 0; transform: translateX(-30px) scale(0.96); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    .order-new-enter {
      animation: slide-in-left 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen font-sans antialiased select-none flex flex-col">

  <!-- TOP BAR (BEYAZ TEMA) -->
  <header class="px-6 py-3.5 flex items-center justify-between sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
    <div class="flex items-center gap-4">
      <a href="/" title="Ana Sayfaya Dön" class="flex items-center gap-2 hover:opacity-80 transition">
        <span class="text-2xl">🍕</span>
        <span class="text-xl font-black text-amber-600 tracking-tight">DELI NAPOLITAN</span>
      </a>
      <span class="text-xs font-black text-slate-700 uppercase tracking-widest bg-slate-100 px-3 py-1 rounded-lg border border-slate-300">
        Mutfak Ekranı
      </span>
      <div class="flex items-center gap-2 bg-emerald-50 border border-emerald-300 px-3 py-1 rounded-full text-emerald-800 text-xs font-bold shadow-xs">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="sync-status">Adisyo Canlı Webhook</span>
      </div>
    </div>

    <!-- Kontroller -->
    <div class="flex items-center gap-3">
      <div id="pizza-counter-badge" class="px-3.5 py-1.5 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-xs font-black tracking-wide">
        Bekleyen: <span id="total-pizzas-count" class="text-rose-900 text-sm">0</span> Pizza
      </div>
      <a href="/servis" class="flex items-center gap-1.5 px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-black transition active:scale-95 shadow-sm">
        <span>🛎️</span>
        <span>Servis Ekranı</span>
      </a>
      <button onclick="manualSync()" title="Şimdi Yenile" class="flex items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-slate-50 border border-slate-300 rounded-xl text-slate-700 text-xs font-bold transition active:scale-95 shadow-xs">
        <span>🔄</span>
        <span>Yenile</span>
      </button>
      <button onclick="toggleSound()" id="sound-btn" title="Sesli Uyarı Aç/Kapat" class="flex items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-slate-50 border border-slate-300 rounded-xl text-slate-700 text-xs font-bold transition active:scale-95 shadow-xs">
        <span id="sound-icon">🔔</span>
        <span id="sound-text">Ses Açık</span>
      </button>
      <button onclick="toggleFullScreen()" title="Tam Ekran Modu" class="flex items-center gap-1.5 px-3.5 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-black transition active:scale-95 shadow-sm">
        <span>⛶</span>
        <span>Tam Ekran</span>
      </button>
    </div>
  </header>

  <!-- ANA KDS ALANI: Sağdan sola akış (Yeni sipariş sol başta) -->
  <main class="flex-1 px-6 py-6 overflow-y-auto">
    <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-5 items-start">
      <!-- Pizza adisyon kartları sol başta olacak şekilde buraya basılır -->
    </div>

    <!-- Boş Durum (Bekleyen Pizza Yok) -->
    <div id="empty-state" class="hidden text-center py-36">
      <div class="text-7xl mb-4">🍕</div>
      <h3 class="text-3xl font-black text-slate-800">Bekleyen Pizza Siparişi Yok</h3>
      <p class="text-base text-slate-500 mt-2 font-medium">Yeni sipariş girildiğinde ekranın sol başına anında otomatik düşecektir.</p>
    </div>
  </main>

  <script>
    let soundEnabled = true;
    let orders = [];
    let previousOrderIds = new Set();
    let isFirstLoad = true;
    let lastRenderSignature = null;
    const renderedCardIds = new Set();

    // Ses Bildirimi (AudioContext ile fırın gong sesi)
    function playKitchenChime() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now);
        osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain1.gain.setValueAtTime(0.35, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.9);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(880, now + 0.18);
        osc2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.35);
        gain2.gain.setValueAtTime(0.3, now + 0.18);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.18);
        osc2.stop(now + 1.2);
      } catch (e) {}
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function getOrderSeconds(order) {
      if (!order.insertDate) return 0;
      try {
        let dateStr = order.insertDate;
        if (!dateStr.includes('+') && !dateStr.includes('Z')) {
          dateStr += '+03:00';
        }
        const dt = new Date(dateStr);
        return Math.max(0, Math.floor((Date.now() - dt.getTime()) / 1000));
      } catch (e) {
        return order.secondsElapsed || 0;
      }
    }

    // Sayaç Renkleri: 0-4 dk yeşil, 4-9 dk sarı, 9+ dk kırmızı
    function getTimerBadgeClass(seconds) {
      if (seconds < 240) {
        return 'bg-emerald-600 text-white border-emerald-700 shadow-sm';
      } else if (seconds < 540) {
        return 'bg-amber-400 text-amber-950 border-amber-500 font-black shadow-sm';
      } else {
        return 'bg-red-600 text-white border-red-700 animate-pulse font-black shadow-md';
      }
    }

    // İmzaya hazır olan pizzaları da ekle (Servis ekranından hazır basılınca Mutfak anında görsün!)
    function computeOrdersSignature(ordersList) {
      return ordersList.map(o => {
        const readySig = (o.pizzas || []).map(p => `${p.id}:${p.isReady ? 1 : 0}`).join(',');
        return `${o.id}_${readySig}`;
      }).join('|');
    }

    function renderOrders() {
      const container = document.getElementById('orders-grid');
      const emptyState = document.getElementById('empty-state');
      const totalPizzasEl = document.getElementById('total-pizzas-count');

      // Sadece içinde pizza olan adisyonları mutfak ekranına bas
      const kitchenOrders = orders.filter(o => o.pizzas && o.pizzas.length > 0);

      let grandTotalPizzas = 0;
      kitchenOrders.forEach(o => {
        const pending = (o.pizzas || []).filter(p => !p.isReady).length;
        grandTotalPizzas += pending;
      });
      if (totalPizzasEl) totalPizzasEl.textContent = grandTotalPizzas;

      if (!kitchenOrders || kitchenOrders.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      container.innerHTML = kitchenOrders.map((order) => {
        const elapsed = getOrderSeconds(order);
        const timerClass = getTimerBadgeClass(elapsed);
        const isUrgent = elapsed >= 540;
        const isNew = !renderedCardIds.has(order.id);
        renderedCardIds.add(order.id);

        let orderTypeBadge = '';
        if (order.orderType === 'PAKET') {
          orderTypeBadge = '<span class="px-2 py-0.5 rounded-md text-[11px] font-black uppercase tracking-wider bg-purple-100 text-purple-800 border border-purple-300">PAKET</span>';
        } else if (order.orderType === 'GEL-AL') {
          orderTypeBadge = '<span class="px-2 py-0.5 rounded-md text-[11px] font-black uppercase tracking-wider bg-cyan-100 text-cyan-800 border border-cyan-300">GEL-AL</span>';
        }

        let timeStr = '';
        try {
          const dt = new Date(order.insertDate);
          timeStr = dt.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        } catch (e) {
          timeStr = '';
        }

        const isAllPizzasReady = order.allPizzasReady;

        return `
          <div 
            id="order-card-${order.id}" 
            class="bg-white rounded-2xl border-2 transition-all shadow-md hover:shadow-lg flex flex-col justify-between overflow-hidden ${
              isAllPizzasReady 
                ? 'border-emerald-500 bg-emerald-50/30' 
                : isUrgent 
                  ? 'border-red-500 card-urgent' 
                  : 'border-slate-200 hover:border-slate-300'
            } ${isNew ? 'order-new-enter' : ''}"
          >
            <!-- KART ÜST BAŞLIĞI: MASA ADI (ÇOK BÜYÜK), ADİSYON NO (BİR PARÇA KÜÇÜK) -->
            <div class="p-4 bg-slate-50 border-b border-slate-200">
              <div class="flex items-start justify-between gap-3">
                
                <div class="min-w-0 flex-1">
                  <div class="flex items-baseline gap-2.5 flex-wrap">
                    <h2 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight leading-none">
                      ${order.tableName}
                    </h2>
                    <span class="text-xl md:text-2xl font-bold text-slate-500">
                      #${order.orderNumber}
                    </span>
                  </div>
                  
                  <div class="flex items-center gap-2 mt-2">
                    ${orderTypeBadge}
                    ${order.waiterName ? `
                      <span class="text-xs text-slate-600 font-semibold truncate">
                        👤 ${order.waiterName}
                      </span>
                    ` : ''}
                    ${timeStr ? `
                      <span class="text-xs text-slate-500 font-medium">
                        🕒 ${timeStr}
                      </span>
                    ` : ''}
                  </div>
                </div>

                <!-- SAYAÇ ROZETİ -->
                <div class="flex-shrink-0">
                  <span 
                    id="timer-${order.id}" 
                    class="px-3.5 py-1.5 rounded-xl border text-base tracking-wider transition-colors shadow-sm font-black inline-block text-center min-w-[76px] ${timerClass}"
                  >
                    ⏱ ${formatTime(elapsed)}
                  </span>
                </div>

              </div>
            </div>

            <!-- PİZZA LİSTESİ: KATEGORİ YOK, FIRINDA YOK, SERVİSTE HAZIRLANAN ÜSTÜ ÇİZİLİ -->
            <div class="p-4 space-y-3 flex-1 bg-white">
              ${(order.pizzas || []).map((pizza) => {
                const isReady = pizza.isReady;

                return `
                  <div class="p-3 rounded-xl border transition-all flex items-start gap-3 ${
                    isReady 
                      ? 'bg-emerald-50/70 border-emerald-300' 
                      : 'bg-slate-50/70 border-slate-200 hover:border-slate-300'
                  }">
                    <!-- ADET -->
                    <span class="text-2xl font-black px-2.5 py-1 rounded-lg flex-shrink-0 leading-none ${
                      isReady 
                        ? 'bg-emerald-100 text-emerald-800 border border-emerald-300 line-through' 
                        : 'bg-amber-100 text-amber-900 border border-amber-300'
                    }">
                      ${pizza.qty}x
                    </span>

                    <!-- PİZZA İSMİ VE NOTLAR -->
                    <div class="min-w-0 flex-1">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-xl font-bold leading-snug tracking-tight ${
                          isReady ? 'text-slate-400 line-through' : 'text-slate-900'
                        }">
                          ${pizza.name}
                        </span>
                        ${isReady ? `
                          <span class="text-[11px] font-black uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300">
                            ✓ Çıktı
                          </span>
                        ` : ''}
                      </div>

                      <!-- ÖZEL NOT -->
                      ${pizza.note ? `
                        <div class="mt-1.5 inline-flex items-center gap-1.5 bg-rose-50 border border-rose-300 text-rose-800 px-2.5 py-1 rounded-lg text-xs font-black tracking-wide">
                          <span>⚠️</span>
                          <span>${pizza.note}</span>
                        </div>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- KART ALTI: DURUM VE TOPLAM -->
            <div class="px-4 py-2.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs text-slate-600 font-bold">
              <span>
                ${isAllPizzasReady ? '<span class="text-emerald-700 font-black">✓ Tüm Pizzalar Servise Çıktı</span>' : 'Fırın Akışı:'}
              </span>
              <span class="text-amber-700 font-black text-sm">
                🍕 ${(order.pizzas || []).length} Pizza
              </span>
            </div>

          </div>
        `;
      }).join('');
    }

    // Sayfa açıldığında önbellekteki siparişleri derhal ekrana bas
    try {
      const saved = localStorage.getItem('deli_mutfak_orders');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) {
          orders = parsed;
          renderOrders();
        }
      }
    } catch (e) {}

    async function syncOrders() {
      try {
        const res = await fetch('/api/orders?_t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
        });
        if (!res.ok) throw new Error('API Hatası');
        const data = await res.json();
        const serverOrders = data.orders || [];

        // KORUMA: Eğer sunucu kota korumasındaysa ve 0 sipariş döndüyse ama ekranda adisyonlarımız varsa SİLME!
        if (serverOrders.length === 0 && orders.length > 0 && data.status && data.status.includes('kota')) {
          const statusEl = document.getElementById('sync-status');
          if (statusEl) {
            statusEl.textContent = 'Adisyo Kota Beklemede (Siparişler Korunuyor)';
          }
          return;
        }

        if (serverOrders.length > 0) {
          try {
            localStorage.setItem('deli_mutfak_orders', JSON.stringify(serverOrders));
          } catch (e) {}
        }

        const currentIds = new Set(serverOrders.map(o => o.id));

        let hasNewOrder = false;
        serverOrders.forEach(so => {
          if (!previousOrderIds.has(so.id) && !isFirstLoad) {
            hasNewOrder = true;
          }
        });

        if (hasNewOrder) {
          playKitchenChime();
        }

        renderedCardIds.forEach(id => {
          if (!currentIds.has(id)) {
            renderedCardIds.delete(id);
          }
        });

        const statusEl = document.getElementById('sync-status');
        if (statusEl) {
          const syncTime = data.lastSyncTime || 'Canlı';
          statusEl.textContent = `Adisyo Canlı (${serverOrders.length} Masa • ${syncTime})`;
        }

        const newSig = computeOrdersSignature(serverOrders);
        const dataChanged = (newSig !== lastRenderSignature);

        orders = serverOrders;
        previousOrderIds = currentIds;
        isFirstLoad = false;

        if (dataChanged) {
          lastRenderSignature = newSig;
          renderOrders();
        }
      } catch (e) {
        const statusEl = document.getElementById('sync-status');
        if (statusEl) {
          statusEl.textContent = 'Bağlantı Bekleniyor...';
        }
      }
    }

    syncOrders();
    setInterval(syncOrders, 3000);

    setInterval(() => {
      orders.forEach(order => {
        const elapsed = getOrderSeconds(order);
        order.secondsElapsed = elapsed;
        const timerEl = document.getElementById(`timer-${order.id}`);
        const cardEl = document.getElementById(`order-card-${order.id}`);

        if (timerEl) {
          timerEl.textContent = `⏱ ${formatTime(elapsed)}`;
          
          if (elapsed >= 540) {
            if (!timerEl.classList.contains('bg-red-600')) {
              timerEl.className = "px-3.5 py-1.5 rounded-xl border text-base tracking-wider transition-colors shadow-md font-black inline-block text-center min-w-[76px] bg-red-600 text-white border-red-700 animate-pulse";
            }
            if (cardEl && !cardEl.classList.contains('card-urgent')) {
              cardEl.classList.add('border-red-500', 'card-urgent');
              cardEl.classList.remove('border-slate-200');
            }
          } else if (elapsed >= 240) {
            if (!timerEl.classList.contains('bg-amber-400')) {
              timerEl.className = "px-3.5 py-1.5 rounded-xl border text-base tracking-wider transition-colors shadow-sm font-black inline-block text-center min-w-[76px] bg-amber-400 text-amber-950 border-amber-500";
            }
          } else {
            if (!timerEl.classList.contains('bg-emerald-600')) {
              timerEl.className = "px-3.5 py-1.5 rounded-xl border text-base tracking-wider transition-colors shadow-sm font-black inline-block text-center min-w-[76px] bg-emerald-600 text-white border-emerald-700";
            }
          }
        }
      });
    }, 1000);

    async function manualSync() {
      const statusEl = document.getElementById('sync-status');
      if (statusEl) statusEl.textContent = 'Adisyo Taranıyor...';
      try {
        await fetch('/api/orders?action=sync-now', { method: 'POST' });
      } catch (e) {}
      await syncOrders();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('sound-icon');
      const text = document.getElementById('sound-text');
      if (soundEnabled) {
        icon.textContent = '🔔';
        text.textContent = 'Ses Açık';
        playKitchenChime();
      } else {
        icon.textContent = '🔕';
        text.textContent = 'Sessiz';
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
