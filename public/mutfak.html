<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deli Napolitan - Fırın Mutfak Ekranı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-urgent {
      0%, 100% { border-color: #ef4444; background-color: #fef2f2; }
      50% { border-color: #dc2626; background-color: #fee2e2; }
    }
    .card-urgent {
      animation: pulse-urgent 2s infinite ease-in-out;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .order-enter {
      animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .order-exit {
      transform: scale(0.92) translateY(24px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#f1f5f9] text-slate-800 min-h-screen font-sans antialiased select-none flex flex-col">

  <!-- TOP BAR: Marka, Canlı Durum ve Kontroller -->
  <header class="px-6 py-3 flex items-center justify-between sticky top-0 z-30 bg-slate-900 text-white shadow-md">
    <div class="flex items-center gap-3">
      <a href="/" title="Ana Sayfaya Dön" class="text-xl font-black text-rose-500 hover:text-rose-400 transition flex items-center gap-2 tracking-tight">
        <span>🍕</span> DELI NAPOLITAN
      </a>
      <span class="text-xs font-bold text-slate-300 uppercase tracking-wider bg-slate-800 px-2.5 py-1 rounded-md border border-slate-700">
        Fırın Mutfak Ekranı
      </span>
      <div class="flex items-center gap-2 bg-emerald-950/80 border border-emerald-500/50 px-3 py-1 rounded-full text-emerald-400 text-xs font-bold shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="sync-status">Adisyo Canlı Bağlantı</span>
      </div>
    </div>

    <div class="flex items-center gap-2.5">
      <a href="/servis" title="Servis Ekranına Geç" class="flex items-center gap-1.5 px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition active:scale-95 shadow">
        <span>🛎️</span>
        <span>Servis Ekranı</span>
      </a>
      <a href="/" title="Ekran Seçim Paneli" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-slate-200 text-xs font-bold transition active:scale-95">
        <span>←</span>
        <span>Giriş</span>
      </a>
      <button onclick="manualSync()" title="Şimdi Senkronize Et" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-slate-200 text-xs font-bold transition active:scale-95">
        <span>🔄</span>
        <span>Yenile</span>
      </button>
      <button onclick="toggleSound()" id="sound-btn" title="Sesli Bildirim" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-slate-200 text-xs font-bold transition active:scale-95">
        <span id="sound-icon">🔔</span>
        <span id="sound-text">Ses Açık</span>
      </button>
      <button onclick="toggleFullScreen()" title="Tam Ekran Modu" class="flex items-center gap-1.5 px-3 py-1.5 bg-rose-600 hover:bg-rose-500 rounded-lg text-white text-xs font-bold transition active:scale-95 shadow">
        <span>⛶</span>
        <span>Tam Ekran</span>
      </button>
    </div>
  </header>

  <!-- MAIN KDS GRID (Landscape Samsung Tablet / Passive Oven Display) -->
  <main class="flex-1 px-6 py-6 overflow-y-auto">
    <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-5 items-start">
      <!-- Kartlar FIFO sıralamasıyla buraya basılır -->
    </div>

    <!-- Boş Durum -->
    <div id="empty-state" class="hidden text-center py-36">
      <div class="text-7xl mb-3">🍕</div>
      <h3 class="text-2xl font-black text-slate-800">Fırında Bekleyen Pizza Yok</h3>
      <p class="text-sm text-slate-500 mt-1">Adisyo'dan yeni pizza siparişi girildiğinde buraya otomatik düşecektir.</p>
    </div>
  </main>

  <script>
    let soundEnabled = true;
    let audioCtx = null;
    let orders = [];
    let previousOrderIds = new Set();
    let isFirstLoad = true;

    // Serviste tüm pizzaları hazır basılıp Mutfak ekranından düşürülen adisyonlar
    const dismissedMutfakOrders = new Set();
    const droppingAnimationOrders = new Set();

    // Web Audio Mutfak Zili
    function playKitchenChime() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(987.77, now);
        osc1.frequency.exponentialRampToValueAtTime(1318.51, now + 0.08);
        gain1.gain.setValueAtTime(0.4, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.5);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1567.98, now + 0.12);
        gain2.gain.setValueAtTime(0.35, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.85);
      } catch (e) {
        console.log("Audio notice:", e);
      }
    }

    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // Tüm pizzaları hazır olan adisyonu animasyonla Mutfak ekranından düşür
    function dropCompletedPizzaOrder(orderId) {
      if (droppingAnimationOrders.has(orderId)) return;
      droppingAnimationOrders.add(orderId);

      const card = document.getElementById(`card-${orderId}`);
      if (card) {
        card.classList.remove('card-urgent');
        card.classList.add('bg-emerald-50', 'border-emerald-500');
        card.innerHTML = `
          <div class="p-8 text-center flex flex-col items-center justify-center my-auto">
            <div class="w-14 h-14 rounded-full bg-emerald-600 text-white flex items-center justify-center text-3xl font-black mb-3 shadow-md animate-bounce">✓</div>
            <div class="text-xl font-black text-emerald-950">Tüm Pizzalar Hazırlandı!</div>
            <div class="text-xs font-bold text-emerald-700 mt-1">Fırından Çıktı &bull; Mutfaktan Kaldırılıyor</div>
          </div>
        `;

        setTimeout(() => {
          card.classList.add('order-exit');
          setTimeout(() => {
            dismissedMutfakOrders.add(orderId);
            droppingAnimationOrders.delete(orderId);
            renderOrders();
          }, 350);
        }, 1100);
      } else {
        dismissedMutfakOrders.add(orderId);
        droppingAnimationOrders.delete(orderId);
        renderOrders();
      }
    }

    // Kartları Ekrana Bas (FIFO Sıralaması: En eski sipariş en başta)
    function renderOrders() {
      const container = document.getElementById('orders-grid');
      const emptyState = document.getElementById('empty-state');

      // Mutfak ekranında yalnızca PİZZA içeren ve henüz fırından düşmemiş adisyonlar listelenir
      const pizzaOrders = orders.filter(o => {
        if (!o.pizzas || o.pizzas.length === 0) return false;
        
        // Eğer tüm pizzaları hazırlandıysa ve zaten düşürüldüyse gösterme
        const allPizzasReady = o.pizzas.every(p => p.isReady);
        if (allPizzasReady && dismissedMutfakOrders.has(o.id)) {
          return false;
        }

        // Eğer bir pizza hazır değilse, önceden düşürüldüyse bile geri getir (yanlış basma koruması)
        if (!allPizzasReady && dismissedMutfakOrders.has(o.id)) {
          dismissedMutfakOrders.delete(o.id);
        }

        return true;
      });

      if (!pizzaOrders || pizzaOrders.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // En uzun süredir bekleyen (en eski) en başta durur
      pizzaOrders.sort((a, b) => b.secondsElapsed - a.secondsElapsed);

      container.innerHTML = pizzaOrders.map((order) => {
        let timerBg = "bg-emerald-50 text-emerald-700 border-emerald-300";
        let cardBorder = "border-slate-300";
        let headerBg = "bg-slate-50";

        if (order.secondsElapsed >= 600) { // 10+ dk
          timerBg = "bg-red-600 text-white border-red-700 animate-pulse font-black shadow-sm";
          cardBorder = "border-red-500 shadow-lg card-urgent";
          headerBg = "bg-red-50/80";
        } else if (order.secondsElapsed >= 300) { // 5-10 dk
          timerBg = "bg-amber-100 text-amber-900 border-amber-400 font-bold";
          cardBorder = "border-amber-400 shadow-md";
          headerBg = "bg-amber-50/60";
        }

        // Sipariş tipi rozeti
        let orderTypeBadge = "bg-slate-800 text-white";
        if (order.orderType === 'PAKET') orderTypeBadge = "bg-blue-600 text-white font-black";
        if (order.orderType === 'GEL-AL') orderTypeBadge = "bg-purple-600 text-white font-black";

        // Tüm pizzalar hazır mı kontrolü
        const allPizzasReady = order.pizzas.every(p => p.isReady);

        // Eğer tüm pizzalar hazır ve henüz düşme animasyonuna girmediyse hemen tetikle!
        if (allPizzasReady && !droppingAnimationOrders.has(order.id) && !dismissedMutfakOrders.has(order.id)) {
          setTimeout(() => dropCompletedPizzaOrder(order.id), 200);
        }

        return `
          <div id="card-${order.id}" class="bg-white rounded-2xl border-2 ${cardBorder} shadow-sm overflow-hidden flex flex-col transition-all duration-300 order-enter">
            
            <!-- KART BAŞLIĞI: MASA VE CANLI SAYAÇ -->
            <div class="${headerBg} px-4 py-3 border-b border-slate-200 flex items-center justify-between">
              <div>
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 rounded text-[11px] font-black uppercase tracking-wider ${orderTypeBadge}">
                    ${order.orderType}
                  </span>
                  <span class="text-xs font-bold text-slate-500">#${order.orderNumber}</span>
                </div>
                <h2 class="text-xl font-black text-slate-900 mt-1 leading-tight tracking-tight">
                  ${order.tableName}
                </h2>
              </div>

              <!-- CANLI SAYAÇ ROZETİ -->
              <div id="timer-${order.id}" class="px-3 py-1.5 rounded-xl border text-base tracking-wider ${timerBg}">
                ⏱ ${formatTime(order.secondsElapsed)}
              </div>
            </div>

            <!-- TÜM PİZZALAR HAZIRSA ANİMASYON ŞERİDİ -->
            ${allPizzasReady ? `
              <div class="bg-emerald-500 text-white px-3 py-1.5 text-xs font-black text-center flex items-center justify-center gap-1.5 animate-pulse">
                <span>✓</span> <span>TÜM PİZZALAR HAZIRLANDI &bull; EKRANDAN KALDIRILIYOR</span>
              </div>
            ` : ''}

            <!-- PİZZA LİSTESİ (DOKUNMASIZ PASİF LİSTE) -->
            <div class="p-4 space-y-3.5 flex-1">
              ${order.pizzas.map((pizza) => {
                const isReady = pizza.isReady;
                return `
                  <div class="p-3 rounded-xl border transition-all ${
                    isReady 
                      ? 'bg-emerald-50/50 border-emerald-300/80 opacity-60' 
                      : 'bg-white border-slate-200'
                  }">
                    <div class="flex items-start justify-between gap-3">
                      <div class="flex items-start gap-2.5">
                        <span class="text-base font-black px-2 py-0.5 rounded-md ${
                          isReady 
                            ? 'bg-emerald-200 text-emerald-800 line-through' 
                            : 'bg-rose-100 text-rose-800'
                        }">
                          ${pizza.qty}x
                        </span>
                        <div>
                          <div class="text-base font-black leading-tight ${
                            isReady 
                              ? 'line-through text-slate-400' 
                              : 'text-slate-900'
                          }">
                            ${pizza.name}
                          </div>

                          <!-- ÜRÜN NOTU VEYA ÇIKARILAN MALZEME -->
                          ${pizza.note ? `
                            <div class="mt-1.5 inline-flex items-center gap-1 bg-rose-50 border border-rose-300 text-rose-900 px-2 py-0.5 rounded text-[11px] font-black tracking-wide">
                              <span>⚠️</span>
                              <span>${pizza.note}</span>
                            </div>
                          ` : ''}
                        </div>
                      </div>

                      <!-- HAZIRLIK DURUMU ROZETİ -->
                      <div>
                        ${isReady ? `
                          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-black bg-emerald-600 text-white shadow-sm">
                            <span>✓</span>
                            <span>HAZIR</span>
                          </span>
                        ` : `
                          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-500 border border-slate-200">
                            Fırında
                          </span>
                        `}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

          </div>
        `;
      }).join('');
    }

    // Sipariş Adisyo'da kapandığında düşürme
    function animateAndRemoveOrder(orderId) {
      dropCompletedPizzaOrder(orderId);
    }

    // --- SENKRONİZASYON VE CANLI BAĞLANTI ---
    async function syncOrders() {
      try {
        const res = await fetch('/api/orders');
        if (!res.ok) throw new Error('API Hatası');
        const data = await res.json();
        const serverOrders = data.orders || [];

        const currentIds = new Set(serverOrders.map(o => o.id));

        // Yeni gelen siparişleri tespit et ve ses çal
        let hasNewOrder = false;
        serverOrders.forEach(so => {
          if (!previousOrderIds.has(so.id) && !isFirstLoad) {
            if (so.pizzas && so.pizzas.length > 0) {
              hasNewOrder = true;
            }
          }
        });

        if (hasNewOrder) {
          playKitchenChime();
        }

        // Adisyo'da tamamen kapanan masaları temizle
        dismissedMutfakOrders.forEach(dismissedId => {
          if (!currentIds.has(dismissedId)) {
            dismissedMutfakOrders.delete(dismissedId);
          }
        });

        // Mevcut siparişleri güncelle
        orders = serverOrders;
        previousOrderIds = currentIds;
        isFirstLoad = false;

        // Üst durum bilgisini güncelle
        const statusEl = document.getElementById('sync-status');
        if (statusEl) {
          const visibleCount = orders.filter(o => o.pizzas && o.pizzas.length > 0 && !dismissedMutfakOrders.has(o.id)).length;
          const syncTime = data.lastSyncTime || 'Canlı';
          statusEl.textContent = `Adisyo Canlı (${visibleCount} Fırın Bekleyen • ${syncTime})`;
        }

        renderOrders();
      } catch (e) {
        const statusEl = document.getElementById('sync-status');
        if (statusEl) {
          statusEl.textContent = 'Bağlantı Bekleniyor...';
        }
      }
    }

    // İlk yükleme ve periyodik sorgulama (Her 2.5 saniyede bir)
    syncOrders();
    setInterval(syncOrders, 2500);

    // Manuel Senkronizasyon Butonu
    async function manualSync() {
      const statusEl = document.getElementById('sync-status');
      if (statusEl) statusEl.textContent = 'Adisyo Taranıyor...';
      try {
        await fetch('/api/sync-now', { method: 'POST' });
      } catch (e) {}
      await syncOrders();
    }

    // Ses Aç/Kapat
    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('sound-icon');
      const text = document.getElementById('sound-text');
      if (soundEnabled) {
        icon.textContent = '🔔';
        text.textContent = 'Ses Açık';
        playKitchenChime();
      } else {
        icon.textContent = '🔕';
        text.textContent = 'Sessiz';
      }
    }

    // Canlı Sayaç Güncelleme (Her saniye)
    setInterval(() => {
      orders.forEach(order => {
        order.secondsElapsed += 1;
        const timerEl = document.getElementById(`timer-${order.id}`);
        if (timerEl) {
          timerEl.textContent = `⏱ ${formatTime(order.secondsElapsed)}`;
          if (order.secondsElapsed >= 600 && !timerEl.classList.contains('bg-red-600')) {
            renderOrders();
          } else if (order.secondsElapsed >= 300 && timerEl.classList.contains('bg-emerald-50')) {
            renderOrders();
          }
        }
      });
    }, 1000);

    // Tam Ekran
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Klavye kısayolları (Test amaçlı): N = Yeni Sipariş, H = Sipariş Düşür
    window.addEventListener('keydown', (e) => {
      if (e.key === 'n' || e.key === 'N') {
        fetch('/api/test/new-order', { method: 'POST' }).then(syncOrders).catch(() => {});
      } else if (e.key === 'h' || e.key === 'H' || e.code === 'Space') {
        fetch('/api/test/drop-order', { method: 'POST' }).then(syncOrders).catch(() => {});
      }
    });
  </script>
</body>
</html>
