<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <title>Deli Napolitan - Mutfak Fırın Ekranı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --header-height: 46px;
      --main-py: 16px;
      --grid-gap: 10px;
      --peek-height: 1.5cm;
      /* Ekranın altında 1,5 cm bırakıldıktan sonra kalan alan tam ortadan 2'ye bölünür */
      /* Ekrana 4 sütunda tam 8 adisyon sığar */
      --slot-height: calc((100vh - var(--header-height) - var(--main-py) - var(--peek-height) - var(--grid-gap)) / 2);
    }
    .kds-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: var(--slot-height);
      gap: var(--grid-gap);
      grid-auto-flow: row;
    }
    @media (max-width: 1024px) {
      .kds-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 640px) {
      .kds-grid {
        grid-template-columns: repeat(1, minmax(0, 1fr));
        grid-auto-rows: auto;
      }
    }
    @keyframes pulse-red {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
      50% { border-color: #b91c1c; box-shadow: 0 0 25px rgba(220, 38, 38, 0.65); }
    }
    .card-urgent {
      animation: pulse-red 1.6s infinite ease-in-out;
    }
    @keyframes slide-in-left {
      from { opacity: 0; transform: translateX(-24px) scale(0.97); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    .order-new-enter {
      animation: slide-in-left 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes card-fade-out {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.92); }
    }
    .order-exit {
      animation: card-fade-out 0.3s ease-out forwards;
      pointer-events: none;
    }
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 h-screen overflow-hidden font-sans antialiased select-none flex flex-col">

  <!-- TOP BAR (BEYAZ TEMA, SABİT 46px) -->
  <header class="h-[46px] px-4 flex items-center justify-between sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm flex-shrink-0">
    <div class="flex items-center gap-3">
      <a href="/" title="Ana Sayfaya Dön" class="text-base md:text-lg font-black text-amber-600 hover:text-amber-500 transition flex items-center gap-1.5 tracking-tight">
        <span>🍕</span> DELI NAPOLITAN
      </a>
      <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wider bg-slate-100 px-2 py-0.5 rounded-md border border-slate-300">
        Mutfak Fırın
      </span>
      <div class="flex items-center gap-1.5 bg-emerald-50 border border-emerald-300 px-2.5 py-0.5 rounded-full text-emerald-800 text-[11px] font-bold shadow-xs">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="sync-status">Adisyo Canlı</span>
      </div>
    </div>

    <!-- Kontroller -->
    <div class="flex items-center gap-2">
      <div id="pizza-counter-badge" class="px-2.5 py-1 bg-rose-50 border border-rose-200 rounded-lg text-rose-800 text-xs font-black tracking-wide">
        Fırın Bekleyen: <span id="total-pizzas-count" class="text-rose-900 text-sm font-black">0</span>
      </div>
      <a href="/servis" class="flex items-center gap-1.5 px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition active:scale-95 shadow-sm">
        <span>🛎️</span>
        <span>Servis Ekranı</span>
      </a>
      <button onclick="manualSync()" title="Şimdi Yenile" class="flex items-center gap-1 px-2.5 py-1 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg text-slate-700 text-xs font-bold transition active:scale-95 shadow-xs">
        <span>🔄</span>
        <span>Yenile</span>
      </button>
      <button onclick="toggleSound()" id="sound-btn" title="Çan Sesi Aç/Kapat" class="flex items-center gap-1 px-2.5 py-1 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg text-slate-700 text-xs font-bold transition active:scale-95 shadow-xs">
        <span id="sound-icon">🔔</span>
        <span id="sound-text">Çan Sesi</span>
      </button>
      <button onclick="toggleFullScreen()" title="Tam Ekran Modu" class="flex items-center gap-1 px-2.5 py-1 bg-slate-800 hover:bg-slate-900 rounded-lg text-white text-xs font-bold transition active:scale-95 shadow-sm">
        <span>⛶</span>
        <span>Tam Ekran</span>
      </button>
    </div>
  </header>

  <!-- ANA MUTFAK GRID ALANI: 4 SÜTUN x 2 SATIR (8 adisyon tam sığar, 1.5 cm alttan 9+ adisyon başlığı görünür) -->
  <main class="flex-1 px-3 py-2 overflow-y-auto">
    <div id="orders-grid" class="kds-grid">
      <!-- Sadece pizza içeren adisyon kartları buraya basılır -->
    </div>

    <!-- Boş Durum (Bekleyen Pizza Yok) -->
    <div id="empty-state" class="hidden text-center py-32">
      <div class="text-6xl mb-3">🍕</div>
      <h3 class="text-2xl font-black text-slate-800">Bekleyen Pizza Siparişi Yok</h3>
      <p class="text-sm text-slate-500 mt-1">Yeni sipariş girildiğinde sol başta anında belirecektir.</p>
    </div>
  </main>

  <script>
    let soundEnabled = true;
    let orders = [];
    let previousOrderIds = new Set();
    let isFirstLoad = true;
    let lastRenderSignature = null;
    const renderedCardIds = new Set();
    const kitchenDismissedOrders = new Set();

    // Mutfak ekranında kapatılan adisyonları hafızadan yükle
    try {
      const savedDismissed = localStorage.getItem('deli_mutfak_dismissed');
      if (savedDismissed) {
        JSON.parse(savedDismissed).forEach(id => kitchenDismissedOrders.add(Number(id)));
      }
    } catch (e) {}

    // SADECE MUTFAK EKRANINDAN ADİSYONU KAPAT (Servis ekranına etki etmez!)
    function dismissKitchenOrder(orderId) {
      if (String(orderId).startsWith('bread_')) {
        return dismissBreadKitchenOrder(orderId);
      }

      const numId = Number(orderId);
      const card = document.getElementById(`order-card-${orderId}`);
      if (card) {
        card.classList.add('order-exit');
      }

      kitchenDismissedOrders.add(numId);
      try {
        localStorage.setItem('deli_mutfak_dismissed', JSON.stringify([...kitchenDismissedOrders]));
      } catch (e) {}

      setTimeout(() => {
        orders = orders.filter(o => Number(o.id) !== numId);
        try {
          localStorage.setItem('deli_mutfak_orders', JSON.stringify(orders));
        } catch (e) {}
        lastRenderSignature = computeOrdersSignature(orders);
        renderOrders();
      }, 300);
    }

    // EKMEK TALEBİNİ MUTFAKTAN DÜŞÜR (Fırıncı ekmeği verdikten sonra basar)
    async function dismissBreadKitchenOrder(orderId) {
      const card = document.getElementById(`order-card-${orderId}`);
      if (card) {
        card.classList.add('order-exit');
      }

      kitchenDismissedOrders.add(String(orderId));
      try {
        localStorage.setItem('deli_mutfak_dismissed', JSON.stringify([...kitchenDismissedOrders]));
      } catch (e) {}

      setTimeout(() => {
        orders = orders.filter(o => String(o.id) !== String(orderId));
        try {
          localStorage.setItem('deli_mutfak_orders', JSON.stringify(orders));
        } catch (e) {}
        lastRenderSignature = computeOrdersSignature(orders);
        renderOrders();
      }, 300);

      try {
        await fetch('/api/orders?action=dismiss-bread-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId })
        });
      } catch (e) {}
      setTimeout(syncOrders, 400);
    }

    // Küçük Pirinç Asılı Yemek / Servis Çanı Sesi (3 Vuruş "Çın Çın Çııın")
    let dinnerBellBuffer = null;

    function getDinnerBellBuffer(ctx) {
      if (dinnerBellBuffer) return dinnerBellBuffer;

      const sr = ctx.sampleRate;
      const dur = 1.05;
      const numSamples = Math.floor(sr * dur);
      const buffer = ctx.createBuffer(1, numSamples, sr);
      const data = buffer.getChannelData(0);

      // 3 Vuruş Zamanlaması: Çın (0s), Çın (0.20s), Çııın (0.42s)
      const strikes = [
        { t: 0.0, mult: 1.0, dur: 0.35 },
        { t: 0.20, mult: 1.0, dur: 0.35 },
        { t: 0.42, mult: 1.5, dur: 0.60 }
      ];

      const f0 = 2450.0; // Küçük pirinç akşam yemeği çanı temel tınısı
      const partials = [
        { r: 1.000, a: 1.00, d: 0.24 }, // Temel Çın tınısı
        { r: 1.215, a: 0.48, d: 0.20 }, // Metalik tınlama
        { r: 1.502, a: 0.35, d: 0.16 }, // Beşli armonik
        { r: 2.000, a: 0.25, d: 0.13 }, // Oktav
        { r: 2.760, a: 0.20, d: 0.08 }, // Çan şakırtısı
        { r: 3.850, a: 0.14, d: 0.04 }  // Tokmak çarpma anı
      ];

      for (let i = 0; i < numSamples; i++) {
        const t = i / sr;
        let sample = 0;

        for (let s = 0; s < strikes.length; s++) {
          const st = strikes[s];
          if (t >= st.t) {
            const dt = t - st.t;
            if (dt < st.dur) {
              const m = st.mult;
              for (let p = 0; p < partials.length; p++) {
                const part = partials[p];
                const freq = f0 * part.r;
                const env = Math.exp(-dt / (part.d * m));
                sample += Math.sin(2 * Math.PI * freq * dt) * part.a * env * 0.22;
              }
              // Metal tokmak darbe tıkırtısı (ilk 12ms)
              if (dt < 0.012) {
                sample += Math.sin(2 * Math.PI * 5600.0 * dt) * Math.exp(-dt * 350.0) * 0.18;
              }
            }
          }
        }
        data[i] = Math.max(-1.0, Math.min(1.0, sample));
      }

      dinnerBellBuffer = buffer;
      return dinnerBellBuffer;
    }

    function playDinnerBell() {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!window.__bellAudioCtx) {
          window.__bellAudioCtx = new AudioCtx();
        }
        const ctx = window.__bellAudioCtx;
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        const buffer = getDinnerBellBuffer(ctx);
        const src = ctx.createBufferSource();
        src.buffer = buffer;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.75, ctx.currentTime);

        src.connect(gain);
        gain.connect(ctx.destination);
        src.start();
      } catch (e) {
        console.warn('Bell audio error:', e);
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function getOrderSeconds(order) {
      if (!order.insertDate) return 0;
      try {
        let dateStr = order.insertDate;
        if (!dateStr.includes('+') && !dateStr.includes('Z')) {
          dateStr += '+03:00';
        }
        const dt = new Date(dateStr);
        return Math.max(0, Math.floor((Date.now() - dt.getTime()) / 1000));
      } catch (e) {
        return order.secondsElapsed || 0;
      }
    }

    // Sayaç Renkleri: 0-4 dk yeşil, 4-9 dk sarı, 9+ dk kırmızı (1 Metreden Net Görünür)
    function getTimerBadgeClass(seconds) {
      if (seconds < 240) {
        return 'bg-emerald-600 text-white border-emerald-700 shadow-sm';
      } else if (seconds < 540) {
        return 'bg-amber-400 text-amber-950 border-amber-500 font-black shadow-sm';
      } else {
        return 'bg-red-600 text-white border-red-700 animate-pulse font-black shadow-md';
      }
    }

    // Mutfak İçin Çok Pizza Kuralı: 6+ pizza veya notlu pizzalar 1 slota sığmaz, 2 slot (row-span-2) kaplar!
    function shouldCardSpanTwoRows(order) {
      const pizzas = order.pizzas || [];
      let score = 0;
      for (const p of pizzas) {
        score += (p.note ? 1.5 : 1);
      }
      return score >= 6.5; // 7 ve üzeri pizza veya notlu 5+ pizza
    }

    // İmzaya hazır olan pizzaları ve kapatılmış adisyonları da ekle
    function computeOrdersSignature(ordersList) {
      return ordersList
        .filter(o => !kitchenDismissedOrders.has(Number(o.id)) && !kitchenDismissedOrders.has(String(o.id)))
        .map(o => {
          if (o.isBreadRequest) return `bread_${o.id}_${o.tableName}`;
          const readySig = (o.pizzas || []).map(p => `${p.id}:${p.isReady ? 1 : 0}:${p.note || ''}`).join(',');
          return `${o.id}_${readySig}_${o.orderNote || ''}`;
        }).join('|');
    }

    // ==========================================
    // MUTFAK KARTLARINI ÇİZ (1 METREDEN OKUNUR ÖZEL TASARIM)
    // ==========================================
    function renderOrders() {
      const container = document.getElementById('orders-grid');
      const emptyState = document.getElementById('empty-state');
      const totalPizzasEl = document.getElementById('total-pizzas-count');

      // SADECE İÇİNDE PİZZA OLAN VEYA EKMEK TALEBİ OLAN VE MUTFAKTA KAPATILMAMIŞ ADİSYONLARI MUTFAK EKRANINA BAS
      const kitchenOrders = orders.filter(o => 
        !kitchenDismissedOrders.has(Number(o.id)) && 
        !kitchenDismissedOrders.has(String(o.id)) && 
        (o.isBreadRequest || (o.pizzas && o.pizzas.length > 0))
      );

      // KURAL: Ekmek talepleri HER ZAMAN EN BAŞTA (sol üst başta, ilk sırada) yer alır!
      // Normal siparişler sol üstten sağa ve aşağıya FIFO olarak akar.
      kitchenOrders.sort((a, b) => {
        if (a.isBreadRequest && !b.isBreadRequest) return -1;
        if (!a.isBreadRequest && b.isBreadRequest) return 1;
        return new Date(a.insertDate) - new Date(b.insertDate);
      });

      let grandTotalPizzas = 0;
      kitchenOrders.forEach(o => {
        if (!o.isBreadRequest) {
          const pending = (o.pizzas || []).filter(p => !p.isReady).length;
          grandTotalPizzas += pending;
        }
      });
      if (totalPizzasEl) totalPizzasEl.textContent = grandTotalPizzas;

      if (!kitchenOrders || kitchenOrders.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      container.innerHTML = kitchenOrders.map((order) => {
        const elapsed = getOrderSeconds(order);
        const timerClass = getTimerBadgeClass(elapsed);
        const isUrgent = elapsed >= 540;
        const isNew = !renderedCardIds.has(order.id);
        renderedCardIds.add(order.id);

        // ÖZEL EKMEK TALEBİ KARTI (Sadece Mutfak & Servis Arası)
        if (order.isBreadRequest) {
          return `
            <div 
              id="order-card-${order.id}" 
              class="bg-amber-50/70 rounded-xl border-2 border-amber-500 shadow-md flex flex-col justify-between overflow-hidden h-full ring-2 ring-amber-300 ${isNew ? 'order-new-enter' : ''}"
            >
              <!-- BAŞLIK: EKMEK TALEBİ + MASA ADI + SADECE MUTFAKTAN DÜŞÜREN ✕ -->
              <div class="px-2.5 py-1.5 bg-amber-100 border-b border-amber-300 flex-shrink-0">
                <div class="flex items-center justify-between gap-1.5">
                  <div class="flex items-center gap-1.5 flex-wrap min-w-0">
                    <span class="text-xl">🍞</span>
                    <span class="text-base md:text-lg font-black text-amber-950 truncate tracking-tight">
                      ${order.tableName}
                    </span>
                    <span class="px-1.5 py-0.5 rounded text-[10px] font-black uppercase tracking-wider bg-amber-200 text-amber-900 border border-amber-400">
                      EKMEK TALEBİ
                    </span>
                    <!-- KIRMIZI ✕: Fırıncı ekmeği verince basar, sadece mutfaktan düşürür -->
                    <button 
                      onclick="dismissBreadKitchenOrder('${order.id}')" 
                      title="Ekmeği fırından çıkarıp verdikten sonra bu talebi kapat"
                      class="w-6 h-6 md:w-7 md:h-7 rounded-full bg-red-600 hover:bg-red-700 active:scale-90 text-white flex items-center justify-center font-black text-xs md:text-sm shadow-xs transition-all border border-red-700 flex-shrink-0 cursor-pointer ml-0.5"
                    >
                      ✕
                    </button>
                  </div>
                  <div class="flex-shrink-0">
                    <span id="timer-${order.id}" class="px-2.5 py-0.5 rounded-md text-xs md:text-sm font-mono font-black tracking-wide shadow-xs inline-block text-center min-w-[62px] border ${timerClass}">
                      ⏱ ${formatTime(elapsed)}
                    </span>
                  </div>
                </div>
              </div>

              <!-- İÇERİK: 1 x Ekmek (1 METREDEN BELİRGİN YAZI) -->
              <div class="p-3 bg-white flex-1 flex flex-col justify-center items-center text-center">
                <div class="text-3xl mb-1">🥖</div>
                <div class="text-lg md:text-xl font-black text-amber-950 tracking-wide bg-amber-100/60 border border-amber-300 px-4 py-2 rounded-xl w-full">
                  1 x Ekmek
                </div>
                <div class="text-[11px] font-bold text-amber-800 mt-1">
                  ⚡ Servis masasından istendi, fırından taze veriniz
                </div>
              </div>

              <!-- ALT BİLGİ -->
              <div class="px-2.5 py-1 bg-amber-100/80 border-t border-amber-200 text-center flex-shrink-0">
                <span class="text-xs font-black text-amber-900">🔔 Fırın Ekmek Talebi</span>
              </div>
            </div>
          `;
        }

        let orderTypeBadge = '';
        if (order.orderType === 'PAKET') {
          orderTypeBadge = '<span class="px-1.5 py-0.2 rounded text-[10px] font-black uppercase tracking-wider bg-purple-100 text-purple-800 border border-purple-300">PAKET</span>';
        } else if (order.orderType === 'GEL-AL') {
          orderTypeBadge = '<span class="px-1.5 py-0.2 rounded text-[10px] font-black uppercase tracking-wider bg-cyan-100 text-cyan-800 border border-cyan-300">GEL-AL</span>';
        }

        const isAllPizzasReady = order.allPizzasReady;
        const isSpan2 = shouldCardSpanTwoRows(order);

        return `
          <div 
            id="order-card-${order.id}" 
            class="bg-white rounded-xl border-2 transition-all shadow-sm hover:shadow-md flex flex-col justify-between overflow-hidden h-full ${
              isSpan2 ? 'row-span-2' : ''
            } ${
              isAllPizzasReady 
                ? 'border-emerald-500 bg-emerald-50/20' 
                : isUrgent 
                  ? 'border-red-500 card-urgent' 
                  : 'border-slate-200 hover:border-slate-300'
            } ${isNew ? 'order-new-enter' : ''}"
          >
            <!-- BAŞLIK: MASA ADI + ADİSYON NO + KIRMIZI KAPAT BUTONU + SÜRE SAYACI -->
            <div class="px-2.5 py-1.5 bg-slate-50 border-b border-slate-200 flex-shrink-0">
              <div class="flex items-center justify-between gap-1.5">
                
                <!-- SOL: Masa Adı (1 Metreden Net Okunur) & Adisyon No & Mutfaktan Kapat Çarpısı -->
                <div class="flex items-center gap-1.5 flex-wrap min-w-0">
                  <h2 class="text-base md:text-lg font-black text-slate-950 tracking-tight leading-none truncate max-w-[130px]" title="${order.tableName}">
                    ${order.tableName}
                  </h2>
                  <span class="text-xs md:text-sm font-bold text-slate-500">
                    #${order.orderNumber}
                  </span>
                  <!-- KIRMIZI YUVARLAK İÇİNDE ÇARPI BUTONU (Sadece Mutfak Ekranından Düşürür, Servise Dokunmaz) -->
                  <button 
                    onclick="dismissKitchenOrder(${order.id})" 
                    title="Bu siparişi sadece mutfak ekranından kapat (servis ekranına etki etmez)"
                    class="w-6 h-6 md:w-7 md:h-7 rounded-full bg-red-600 hover:bg-red-700 active:scale-90 text-white flex items-center justify-center font-black text-xs md:text-sm shadow-xs transition-all border border-red-700 flex-shrink-0 cursor-pointer ml-0.5"
                  >
                    ✕
                  </button>
                  ${orderTypeBadge}
                </div>

                <!-- SAĞ: SAYAÇ ROZETİ (1 Metreden Büyüklüğü & Rengiyle Farkedilir) -->
                <div class="flex-shrink-0">
                  <span 
                    id="timer-${order.id}" 
                    class="px-2.5 py-0.5 rounded-md text-xs md:text-sm font-mono font-black tracking-wide shadow-xs inline-block text-center min-w-[62px] border ${timerClass}"
                  >
                    ⏱ ${formatTime(elapsed)}
                  </span>
                </div>

              </div>
            </div>

            <!-- ADİSYON NOTU (Varsa) -->
            ${order.orderNote ? `
              <div class="px-2.5 py-1 bg-amber-50 border-b border-amber-300 text-amber-950 text-xs font-black flex items-center gap-1.5 flex-shrink-0">
                <span class="text-sm">📝</span>
                <span class="truncate" title="${order.orderNote}">Adisyon Notu: ${order.orderNote}</span>
              </div>
            ` : ''}

            <!-- PİZZA LİSTESİ: YALNIZCA PİZZALAR, KATEGORİ YOK, FIRINDA YOK (1 METREDEN OKUNUR) -->
            <div class="p-2 space-y-1.5 flex-1 overflow-y-auto bg-white">
              ${(order.pizzas || []).map((pizza) => {
                const isReady = pizza.isReady;

                return `
                  <div class="py-1.5 px-2.5 rounded-lg border transition-all flex items-start gap-2.5 ${
                    isReady 
                      ? 'bg-emerald-50/70 border-emerald-300' 
                      : 'bg-slate-50/70 border-slate-200 hover:border-slate-300'
                  }">
                    
                    <!-- ADET KUTUSU: 1x kaldırıldı, sadece 2x ve üzeri çoklu adetlerde fırıncıya uyarı olarak gösterilir -->
                    ${pizza.qty > 1 ? `
                      <span class="text-sm md:text-base font-black px-2 py-0.5 rounded-md flex-shrink-0 leading-none ${
                        isReady 
                          ? 'bg-emerald-100 text-emerald-800 border border-emerald-300 line-through' 
                          : 'bg-amber-100 text-amber-950 border border-amber-300'
                      }">
                        ${pizza.qty}x
                      </span>
                    ` : ''}

                    <!-- PİZZA İSMİ VE NOTLAR -->
                    <div class="min-w-0 flex-1">
                      <div class="flex items-center justify-between gap-1.5">
                        <span class="text-sm md:text-base font-black leading-snug block truncate whitespace-nowrap ${
                          isReady ? 'text-slate-400 line-through' : 'text-slate-950'
                        }" title="${pizza.name}">
                          ${pizza.name}
                        </span>
                        
                        ${isReady ? `
                          <span class="text-[10px] font-black uppercase tracking-wider px-1.5 py-0.2 rounded bg-emerald-100 text-emerald-800 border border-emerald-300 flex-shrink-0">
                            ✓ Çıktı
                          </span>
                        ` : ''}
                      </div>

                      <!-- ÖZEL PİZZA NOTU (1 Metreden Uyaran Belirgin Kırmızı Kutu) -->
                      ${pizza.note ? `
                        <div class="mt-1 flex items-start gap-1 bg-rose-50 border border-rose-300 text-rose-950 px-2 py-0.5 rounded-md text-xs md:text-sm font-black tracking-wide shadow-2xs max-w-full">
                          <span class="text-xs md:text-sm leading-none flex-shrink-0">⚠️</span>
                          <span class="break-words leading-tight" title="${pizza.note}">${pizza.note}</span>
                        </div>
                      ` : ''}
                    </div>

                  </div>
                `;
              }).join('')}
            </div>

            <!-- KART ALTI: FIRIN DURUMU VE TOPLAM PİZZA -->
            <div class="px-2.5 py-1 bg-slate-50 border-t border-slate-200/80 flex items-center justify-between text-[11px] text-slate-600 font-bold flex-shrink-0">
              <span>
                ${isAllPizzasReady ? '<span class="text-emerald-700 font-black">✓ Tüm Pizzalar Servise Çıktı</span>' : '🍕 Fırın Akışı'}
              </span>
              <span class="text-amber-800 font-black text-xs">
                ${(order.pizzas || []).length} Pizza
              </span>
            </div>

          </div>
        `;
      }).join('');
    }

    // Sayfa açıldığında önbellekteki siparişleri derhal ekrana bas (3 saatten eskileri süpür)
    try {
      const saved = localStorage.getItem('deli_mutfak_orders');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) {
          orders = parsed.filter(o => getOrderSeconds(o) < 10800);
          if (orders.length > 0) renderOrders();
          else localStorage.setItem('deli_mutfak_orders', JSON.stringify([]));
        }
      }
    } catch (e) {}

    let consecutiveZeroCount = 0;

    function processOrdersData(data) {
      if (!data) return;

      const rawServerOrders = Array.isArray(data.orders) ? data.orders : [];
      // 3 saatten (180 dakika) eski veya dünden kalmış siparişleri kesinlikle kabul etme
      const serverOrders = rawServerOrders.filter(o => getOrderSeconds(o) < 10800);

      // ==========================================
      // KORUMA 1: KOTA KORUMASI VE SENKRONİZASYON HATASI KORUMASI
      // Eğer Adisyo kota sınırındaysa (601) veya henüz senkronize olunamadıysa,
      // ve ekranda aktif siparişlerimiz varsa ASLA SİLME!
      // ==========================================
      const isQuota = data.isQuotaProtected || (data.status && data.status.includes('kota'));
      if (serverOrders.length === 0 && orders.length > 0) {
        if (isQuota || data.lastSyncSuccess === false) {
          const statusEl = document.getElementById('sync-status');
          if (statusEl) {
            const kitchenCount = orders.filter(o => 
              !kitchenDismissedOrders.has(Number(o.id)) && 
              !kitchenDismissedOrders.has(String(o.id)) && 
              (o.isBreadRequest || (o.pizzas && o.pizzas.length > 0))
            ).length;
            statusEl.textContent = `Adisyo Kota Beklemede (${kitchenCount} Masa Korunuyor)`;
          }
          return;
        }

        // ==========================================
        // KORUMA 2: ANİ SIFIRLANMA TEYİDİ VE OTOMATİK KURTARMA
        // Canlı restoranda masalar varken ekran 2 sorguda silinmez!
        // 2. boş sorguda arka planda otomatik sync-now çağırarak kendini kurtarır.
        // En az 10 ardışık onay (30+ saniye) boyunca teyit edilmedikçe ekran temizlenmez.
        // ==========================================
        consecutiveZeroCount++;
        if (consecutiveZeroCount < 10) {
          if (consecutiveZeroCount === 2) {
            // Arka planda otomatik taze veri çek (otomatik kurtarma, yenileye basmaya gerek kalmaz)
            fetch('/api/orders?action=sync-now', { 
              method: 'POST', 
              headers: { 'Cache-Control': 'no-cache' } 
            })
            .then(r => r.json())
            .then(d => {
              if (d && Array.isArray(d.orders) && d.orders.length > 0) {
                processOrdersData(d);
              }
            })
            .catch(() => {});
          }

          const statusEl = document.getElementById('sync-status');
          if (statusEl) {
            const kitchenCount = orders.filter(o => 
              !kitchenDismissedOrders.has(Number(o.id)) && 
              !kitchenDismissedOrders.has(String(o.id)) && 
              (o.isBreadRequest || (o.pizzas && o.pizzas.length > 0))
            ).length;
            statusEl.textContent = `Adisyo Doğrulanıyor (${kitchenCount} Masa Korunuyor)`;
          }
          return;
        }
      } else {
        consecutiveZeroCount = 0;
      }

      // ==========================================
      // KORUMA 3: LOCALSTORAGE KORUMASI
      // Sadece teyitli siparişler varken veya kesin onaylanmış temiz kapanışta güncelle
      // ==========================================
      if (serverOrders.length > 0) {
        try {
          localStorage.setItem('deli_mutfak_orders', JSON.stringify(serverOrders));
        } catch (e) {}
      } else if (consecutiveZeroCount >= 10 && data.lastSyncSuccess) {
        try {
          localStorage.setItem('deli_mutfak_orders', JSON.stringify([]));
        } catch (e) {}
      }

      const currentIds = new Set(serverOrders.map(o => o.id));

      let hasNewOrder = false;
      serverOrders.forEach(so => {
        if (!previousOrderIds.has(so.id) && !isFirstLoad) {
          hasNewOrder = true;
        }
      });

      if (hasNewOrder) {
        playDinnerBell();
      }

      renderedCardIds.forEach(id => {
        if (!currentIds.has(id)) {
          renderedCardIds.delete(id);
        }
      });

      // Adisyo'da tamamen kapanmış masaları mutfak dismiss hafızasından da temizle
      if (currentIds.size > 0) {
        kitchenDismissedOrders.forEach(id => {
          if (!currentIds.has(Number(id)) && !currentIds.has(String(id))) {
            kitchenDismissedOrders.delete(id);
          }
        });
        try {
          localStorage.setItem('deli_mutfak_dismissed', JSON.stringify([...kitchenDismissedOrders]));
        } catch (e) {}
      }

      const statusEl = document.getElementById('sync-status');
      if (statusEl) {
        const kitchenCount = serverOrders.filter(o => 
          !kitchenDismissedOrders.has(Number(o.id)) && 
          !kitchenDismissedOrders.has(String(o.id)) && 
          (o.isBreadRequest || (o.pizzas && o.pizzas.length > 0))
        ).length;
        const syncTime = data.lastSyncTime || 'Canlı';
        statusEl.textContent = `Adisyo Canlı (${kitchenCount} Masa • ${syncTime})`;
      }

      // KORUMA 4: KISMİ VERİ KORUMASI (Sunucu Adisyo ile henüz senkronize olmamışsa mevcut masaları asla silme!)
      let finalOrders = [...serverOrders];
      if (data.hasSyncedWithAdisyo === false || data.rawCount === 0) {
        const existingAdisyoOrders = orders.filter(o => 
          !o.isBreadRequest && 
          !kitchenDismissedOrders.has(Number(o.id)) && 
          !kitchenDismissedOrders.has(String(o.id))
        );
        if (existingAdisyoOrders.length > 0) {
          const serverIds = new Set(serverOrders.map(o => o.id));
          existingAdisyoOrders.forEach(eo => {
            if (!serverIds.has(eo.id)) {
              finalOrders.push(eo);
            }
          });
        }
      }

      finalOrders.sort((a, b) => {
        if (a.isBreadRequest && !b.isBreadRequest) return -1;
        if (!a.isBreadRequest && b.isBreadRequest) return 1;
        return new Date(a.insertDate) - new Date(b.insertDate);
      });

      const newSig = computeOrdersSignature(finalOrders);
      const dataChanged = (newSig !== lastRenderSignature);

      orders = finalOrders;
      previousOrderIds = new Set(finalOrders.map(o => o.id));
      isFirstLoad = false;

      if (dataChanged) {
        lastRenderSignature = newSig;
        renderOrders();
      }
    }

    async function syncOrders() {
      try {
        const activeBread = orders.filter(o => o.isBreadRequest);
        const headers = { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' };
        if (activeBread.length > 0) {
          headers['x-bread-requests'] = encodeURIComponent(JSON.stringify(activeBread));
        }
        const res = await fetch('/api/orders?_t=' + Date.now(), {
          cache: 'no-store',
          headers
        });
        if (!res.ok) {
          // 429 veya sunucu hatası durumunda mevcut siparişleri koru
          const statusEl = document.getElementById('sync-status');
          if (statusEl) {
            const count = orders.filter(o => !kitchenDismissedOrders.has(Number(o.id)) && o.pizzas && o.pizzas.length > 0).length;
            statusEl.textContent = orders.length > 0 ? `Adisyo Beklemede (${count} Masa Korunuyor)` : 'Bağlantı Bekleniyor...';
          }
          return;
        }
        const data = await res.json();
        processOrdersData(data);
      } catch (e) {
        const statusEl = document.getElementById('sync-status');
        if (statusEl) {
          const count = orders.filter(o => !kitchenDismissedOrders.has(Number(o.id)) && o.pizzas && o.pizzas.length > 0).length;
          statusEl.textContent = orders.length > 0 ? `Adisyo Beklemede (${count} Masa Korunuyor)` : 'Bağlantı Bekleniyor...';
        }
      }
    }

    syncOrders();
    setInterval(syncOrders, 3000);

    setInterval(() => {
      orders.forEach(order => {
        const elapsed = getOrderSeconds(order);
        order.secondsElapsed = elapsed;
        const timerEl = document.getElementById(`timer-${order.id}`);
        const cardEl = document.getElementById(`order-card-${order.id}`);

        if (timerEl) {
          timerEl.textContent = `⏱ ${formatTime(elapsed)}`;
          
          if (elapsed >= 540) {
            if (!timerEl.classList.contains('bg-red-600')) {
              timerEl.className = "px-2.5 py-0.5 rounded-md text-xs md:text-sm font-mono font-black tracking-wide shadow-xs inline-block text-center min-w-[62px] border bg-red-600 text-white border-red-700 animate-pulse";
            }
            if (cardEl && !cardEl.classList.contains('card-urgent')) {
              cardEl.classList.add('border-red-500', 'card-urgent');
              cardEl.classList.remove('border-slate-200');
            }
          } else if (elapsed >= 240) {
            if (!timerEl.classList.contains('bg-amber-400')) {
              timerEl.className = "px-2.5 py-0.5 rounded-md text-xs md:text-sm font-mono font-black tracking-wide shadow-xs inline-block text-center min-w-[62px] border bg-amber-400 text-amber-950 border-amber-500";
            }
          } else {
            if (!timerEl.classList.contains('bg-emerald-600')) {
              timerEl.className = "px-2.5 py-0.5 rounded-md text-xs md:text-sm font-mono font-black tracking-wide shadow-xs inline-block text-center min-w-[62px] border bg-emerald-600 text-white border-emerald-700";
            }
          }
        }
      });
    }, 1000);

    async function manualSync() {
      const statusEl = document.getElementById('sync-status');
      if (statusEl) statusEl.textContent = 'Adisyo Taranıyor...';
      try {
        const res = await fetch('/api/orders?action=sync-now', { 
          method: 'POST',
          headers: { 'Cache-Control': 'no-cache' }
        });
        if (res.ok) {
          const data = await res.json();
          processOrdersData(data);
          return;
        }
      } catch (e) {}
      await syncOrders();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('sound-icon');
      const text = document.getElementById('sound-text');
      if (soundEnabled) {
        icon.textContent = '🔔';
        text.textContent = 'Çan Sesi';
        playDinnerBell();
      } else {
        icon.textContent = '🔇';
        text.textContent = 'Sessiz';
      }
    }

    // Mobil ve tabletlerde ses çalma kilidini ilk dokunuşta aç
    document.addEventListener('click', () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const testCtx = new AudioCtx();
          if (testCtx.state === 'suspended') testCtx.resume();
        }
      } catch (e) {}
    }, { once: true });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
