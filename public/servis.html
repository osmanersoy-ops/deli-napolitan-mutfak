<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <title>Deli Napolitan - Servis & Expo Ekranı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --header-height: 46px;
      --main-py: 16px;
      --grid-gap: 10px;
      --peek-height: 1.5cm;
      /* Ekranın altında 1,5 cm bırakıldıktan sonra kalan alan tam ortadan 2'ye bölünür */
      /* Ekrana 4 sütunda tam 8 adisyon sığar */
      --slot-height: calc((100vh - var(--header-height) - var(--main-py) - var(--peek-height) - var(--grid-gap)) / 2);
    }
    .kds-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: var(--slot-height);
      gap: var(--grid-gap);
      grid-auto-flow: row;
    }
    @media (max-width: 1024px) {
      .kds-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 640px) {
      .kds-grid {
        grid-template-columns: repeat(1, minmax(0, 1fr));
        grid-auto-rows: auto;
      }
    }
    @keyframes pulse-urgent {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.35); }
      50% { border-color: #dc2626; box-shadow: 0 0 25px rgba(220, 38, 38, 0.6); }
    }
    .card-urgent {
      animation: pulse-urgent 2s infinite ease-in-out;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .order-enter {
      animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .order-exit {
      transform: scale(0.92) translateY(24px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 h-screen overflow-hidden font-sans antialiased select-none flex flex-col">

  <!-- TOP BAR (BEYAZ TEMA, SABİT 46px) -->
  <header class="h-[46px] px-4 flex items-center justify-between sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm flex-shrink-0">
    <div class="flex items-center gap-3">
      <a href="/" title="Ana Sayfaya Dön" class="text-base md:text-lg font-black text-amber-600 hover:text-amber-500 transition flex items-center gap-1.5 tracking-tight">
        <span>🛎️</span> DELI NAPOLITAN
      </a>
      <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wider bg-slate-100 px-2 py-0.5 rounded-md border border-slate-300">
        Servis & Expo
      </span>
      <div class="flex items-center gap-1.5 bg-emerald-50 border border-emerald-300 px-2.5 py-0.5 rounded-full text-emerald-800 text-[11px] font-bold shadow-xs">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="sync-status">Adisyo Canlı</span>
      </div>

      <!-- EKMEK TALEBİ BUTONU (Adisyo'ya dokunmaz, mutfak ekranının en başına adisyon olarak düşer) -->
      <button 
        onclick="submitBreadRequest()" 
        id="btn-bread-request"
        title="Mutfaktan taze ekmek iste (Mutfak fırın ekranının en başına anında adisyon düşer)"
        class="flex items-center gap-1.5 px-3 py-1 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white rounded-lg text-xs md:text-sm font-black shadow-xs transition-all border border-amber-600 cursor-pointer ml-1"
      >
        <span class="text-sm">🍞</span>
        <span id="btn-bread-text">Ekmek Talebi</span>
      </button>
    </div>

    <div class="flex items-center gap-2">
      <a href="/mutfak" title="Mutfak Fırın Ekranına Geç" class="flex items-center gap-1.5 px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-bold transition active:scale-95 shadow-sm">
        <span>🍕</span>
        <span>Mutfak Ekranı</span>
      </a>
      <button onclick="manualSync()" title="Şimdi Yenile" class="flex items-center gap-1 px-2.5 py-1 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg text-slate-700 text-xs font-bold transition active:scale-95 shadow-xs">
        <span>🔄</span>
        <span>Yenile</span>
      </button>
      <button onclick="toggleFullScreen()" title="Tam Ekran Modu" class="flex items-center gap-1 px-2.5 py-1 bg-slate-800 hover:bg-slate-900 rounded-lg text-white text-xs font-bold transition active:scale-95 shadow-sm">
        <span>⛶</span>
        <span>Tam Ekran</span>
      </button>
    </div>
  </header>

  <!-- MAIN KDS GRID: 4 SÜTUN x 2 SATIR (8 adisyon tam sığar, 1.5 cm alttan 9+ adisyon başlığı görünür) -->
  <main class="flex-1 px-3 py-2 overflow-y-auto">
    <div id="orders-grid" class="kds-grid">
      <!-- Tüm ürünleriyle adisyon kartları 4 sütun halinde buraya basılır -->
    </div>

    <!-- Boş Durum -->
    <div id="empty-state" class="hidden text-center py-32">
      <div class="text-6xl mb-3">🛎️</div>
      <h3 class="text-2xl font-black text-slate-800">Bekleyen Servis Adisyonu Yok</h3>
      <p class="text-sm text-slate-500 mt-1">Adisyo'dan sipariş girildiğinde buraya anında düşecektir.</p>
    </div>
  </main>

  <script>
    let orders = [];
    let previousOrderIds = new Set();
    let isFirstLoad = true;
    let lastRenderSignature = null;
    const localReadySet = new Set();
    const recentlyUnready = new Map(); // pid -> timestamp (son 30 sn'de elle un-ready yapılanlar)
    const renderedCardIds = new Set();
    const dismissedOrders = new Set();
    const dismissedBreadSet = new Set();

    // Kapatılmış ekmek taleplerini yükle
    try {
      const savedDismissedBread = localStorage.getItem('deli_dismissed_bread');
      if (savedDismissedBread) {
        JSON.parse(savedDismissedBread).forEach(id => dismissedBreadSet.add(String(id)));
      }
    } catch (e) {}

    // Hafızadan hazır olan ürünleri yükle (cihazlar arası ve yenilemelerde koruma)
    try {
      const savedReady = localStorage.getItem('deli_servis_ready_pids');
      if (savedReady) {
        JSON.parse(savedReady).forEach(id => localReadySet.add(String(id)));
      }
    } catch (e) {}

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function getOrderSeconds(order) {
      if (!order.insertDate) return 0;
      try {
        let dateStr = order.insertDate;
        if (!dateStr.includes('+') && !dateStr.includes('Z')) {
          dateStr += '+03:00';
        }
        const dt = new Date(dateStr);
        return Math.max(0, Math.floor((Date.now() - dt.getTime()) / 1000));
      } catch (e) {
        return order.secondsElapsed || 0;
      }
    }

    // Ürün Sıralama Grubu:
    // 1: Pizzalar (En Üstte)
    // 2: Ortaya (Yan ürünler, salatalar, mezeler, tatlılar vb. - Ortada)
    // 3: İçecekler (En Altta)
    function getProductGroup(item) {
      const cat = (item.category || '').toLowerCase();
      const name = (item.name || '').toLowerCase();

      // 1. Pizzalar
      if (
        item.isPizza || 
        cat.includes('pizza') || 
        name.includes('pizza') || 
        name.includes('calzone') || 
        name.includes('margherita') || 
        name.includes('napolitan')
      ) {
        return 1;
      }

      // 3. İçecekler
      if (
        cat.includes('içecek') || cat.includes('icecek') || cat.includes('mesrubat') || cat.includes('meşrubat') ||
        cat.includes('kahve') || cat.includes('su') || cat.includes('bira') || cat.includes('şarap') || cat.includes('sarap') ||
        cat.includes('kokteyl') || cat.includes('alkol') || cat.includes('soda') || cat.includes('ayran') ||
        name.includes('kola') || name.includes('cola') || name.includes('fanta') || name.includes('sprite') ||
        name.includes('ayran') || name.includes('soda') || name.includes('su') ||
        name.includes('bira') || name.includes('çay') || name.includes('cay') || name.includes('kahve') || name.includes('espresso')
      ) {
        return 3;
      }

      // 2. Ortaya (Salata, tatlı, makarna, başlangıç vb.)
      return 2;
    }

    function getQtyBadgeClass(item, isReady) {
      if (isReady) {
        return 'bg-emerald-100 text-emerald-800 border border-emerald-300 line-through';
      }
      const group = getProductGroup(item);
      if (group === 3) {
        // İçecekler: Turuncu
        return 'bg-orange-500 text-white border border-orange-600 shadow-2xs';
      }
      const cat = (item.category || '').toLowerCase();
      const name = (item.name || '').toLowerCase();
      if (group !== 1) {
        if (item.isSalad || cat.includes('salat') || name.includes('salat')) {
          // Salatalar: Mor
          return 'bg-purple-600 text-white border border-purple-700 shadow-2xs';
        }
        if (
          cat.includes('tatl') || cat.includes('dessert') ||
          name.includes('tatl') || name.includes('tiramisu') ||
          name.includes('cheesecake') || name.includes('sufle') ||
          name.includes('panna') || name.includes('cannoli') ||
          name.includes('brownie') || name.includes('dondurma')
        ) {
          // Tatlılar: Koyu Yeşil
          return 'bg-emerald-800 text-white border border-emerald-900 shadow-2xs';
        }
      }
      // Pizzalar ve diğer ürünler: Standart sarı
      return 'bg-amber-100 text-amber-900 border border-amber-300';
    }

    // Adisyon Çok Fazla Ürün İçerip Kendine Ayrılan 1 Slota Sığmıyor mu?
    // Kullanıcı kuralı: Kendine ayrılan alana sığmıyorsa (örn 9-10 ürün),
    // bulunduğu sütunda tek kalsın (row-span-2) ve bir altına adisyon gelmesin!
    function shouldCardSpanTwoRows(order) {
      const products = order.products || [];
      return products.length > 4; // 4 üründen sonra (5+ ürün) uzun adisyon (row-span-2)
    }

    function getOrderDismissKey(order) {
      if (!order) return '';
      return String(order.dismissKey || order.id);
    }

    function computeOrdersSignature(ordersList) {
      return ordersList.map(o => {
        const pSig = (o.products || []).map(p => `${p.id}:${p.isReady ? 1 : 0}`).join(',');
        return `${o.id}_${o.dismissKey || ''}_${o.tableName || ''}_${pSig}`;
      }).join('|');
    }

    // ==========================================
    // 1. ÜRÜN HAZIR BUTONU (Tek Tek Hazırla)
    // ==========================================
    async function toggleProductReady(orderId, productId) {
      if (String(productId).startsWith('bread_') || String(orderId).startsWith('bread_')) {
        markAllOrderReady(orderId);
        return;
      }

      const pid = String(productId);
      const order = orders.find(o => o.id === orderId);
      if (!order) return;
      const product = (order.products || []).find(p => String(p.id) === pid);
      if (!product) return;

      const newReadyState = !product.isReady;
      product.isReady = newReadyState;

      // Yerel kalıcı durum güncellemesi (ASLA süreyle silinmez!)
      if (newReadyState) {
        localReadySet.add(pid);
        recentlyUnready.delete(pid);
      } else {
        localReadySet.delete(pid);
        recentlyUnready.set(pid, Date.now());
      }

      try {
        localStorage.setItem('deli_servis_ready_pids', JSON.stringify([...localReadySet]));
      } catch (e) {}

      renderOrders();

      // Sunucuya ve diğer tüm açık ekranlara anında bildir
      try {
        await fetch('/api/orders?action=toggle-ready', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-ready-ids': [...localReadySet].join(',')
          },
          body: JSON.stringify({ productId: pid, isReady: newReadyState })
        });
      } catch (e) {}
    }

    // ==========================================
    // 2. MASA ADI YANINDAKİ "TÜMÜ HAZIR" BUTONU
    // (Adisyo'da masayı mavi yapar ve mutfaktan düşürür!)
    // ==========================================
    async function markAllOrderReady(orderId) {
      const sOrderId = String(orderId);

      // Eğer Ekmek Talebi ise iki ekrandan da anında düşür (ASLA Adisyo'ya gitmez!)
      if (sOrderId.startsWith('bread_')) {
        dismissedBreadSet.add(sOrderId);
        try {
          localStorage.setItem('deli_dismissed_bread', JSON.stringify([...dismissedBreadSet]));
        } catch (e) {}

        const card = document.getElementById(`servis-card-${orderId}`);
        if (card) {
          card.classList.add('order-exit');
        }

        orders = orders.filter(o => String(o.id) !== sOrderId);
        try {
          localStorage.setItem('deli_servis_orders', JSON.stringify(orders));
        } catch (e) {}
        renderOrders();

        try {
          await fetch('/api/orders?action=dismiss-bread-request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId: sOrderId })
          });
        } catch (e) {}
        setTimeout(syncOrders, 300);
        return;
      }

      const card = document.getElementById(`servis-card-${orderId}`);
      if (card) {
        card.classList.add('order-exit');
      }

      // Kapatılan adisyondaki ürünleri hazır hafızasından temizle
      const closedOrder = orders.find(o => o.id === orderId);
      const dKey = closedOrder ? getOrderDismissKey(closedOrder) : String(orderId);
      if (closedOrder && Array.isArray(closedOrder.products)) {
        closedOrder.products.forEach(p => localReadySet.delete(String(p.id)));
        try {
          localStorage.setItem('deli_servis_ready_pids', JSON.stringify([...localReadySet]));
        } catch (e) {}
      }

      dismissedOrders.add(dKey);

      setTimeout(() => {
        orders = orders.filter(o => o.id !== orderId);
        try {
          localStorage.setItem('deli_servis_orders', JSON.stringify(orders));
        } catch (e) {}
        renderOrders();
      }, 350);

      // Adisyo'ya resmi Prepared komutu gönder (Adisyo mutfağından düşer & masa mavi olur!)
      try {
        await fetch('/api/orders?action=mark-all-ready', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId, dismissKey: dKey })
        });
      } catch (e) {
        console.error('Mark all ready error:', e);
      }

      setTimeout(syncOrders, 800);
    }

    // ==========================================
    // KARTLARI ÇİZ (SERVİS EKRANI - TABLET TAM EKRAN DÜZENİ)
    // ==========================================
    function renderOrders() {
      const container = document.getElementById('orders-grid');
      const emptyState = document.getElementById('empty-state');

      const visibleOrders = orders.filter(o => {
        if (o.isBreadRequest && dismissedBreadSet.has(String(o.id))) return false;
        return !dismissedOrders.has(getOrderDismissKey(o));
      });

      // KURAL: En eski sipariş sol başta (FIFO), yeni gelenler sağa eklenir (Ekmek talepleri de aynı sıraya girer)
      visibleOrders.sort((a, b) => new Date(a.insertDate) - new Date(b.insertDate));

      if (!visibleOrders || visibleOrders.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      container.innerHTML = visibleOrders.map((order) => {
        const elapsed = getOrderSeconds(order);
        const isUrgent = elapsed >= 540;
        const isNew = !renderedCardIds.has(order.id);
        renderedCardIds.add(order.id);

        // ÖZEL EKMEK TALEBİ KARTI (Sadece Mutfak & Servis Arası)
        if (order.isBreadRequest) {
          return `
            <div 
              id="servis-card-${order.id}" 
              class="bg-amber-50/70 rounded-xl border-2 border-amber-500 transition-all shadow-md flex flex-col justify-between overflow-hidden h-full ring-2 ring-amber-300 ${isNew ? 'order-enter' : ''}"
            >
              <!-- BAŞLIK: EKMEK TALEBİ + MASA ADI + TESLİM ALINDI BUTONU -->
              <div class="px-2.5 py-2 bg-amber-100 border-b border-amber-300 flex-shrink-0">
                <div class="flex items-center justify-between gap-1.5">
                  <div class="flex items-center gap-1.5 flex-wrap min-w-0">
                    <span class="text-lg">🍞</span>
                    <h2 class="text-sm md:text-base font-black text-amber-950 tracking-tight leading-none truncate max-w-[130px]" title="${order.tableName}">
                      ${order.tableName}
                    </h2>
                    <span class="text-xs font-bold text-amber-800">#EKM</span>
                    <span class="px-1.5 py-0.2 rounded text-[10px] font-black uppercase tracking-wider bg-amber-200 text-amber-900 border border-amber-400">EKMEK</span>
                  </div>
                  <div>
                    <button 
                      onclick="markAllOrderReady('${order.id}')"
                      title="Ekmeği teslim aldım, talebi kapat"
                      class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 active:scale-95 text-white rounded-lg font-black text-xs md:text-sm tracking-wide shadow-sm transition flex items-center gap-1 cursor-pointer"
                    >
                      <span>✓</span>
                      <span>Teslim Alındı</span>
                    </button>
                  </div>
                </div>
              </div>

              <!-- İÇERİK: 1 x Ekmek -->
              <div class="p-3 bg-white flex-1 flex flex-col justify-center items-center text-center">
                <div class="text-3xl mb-1">🥖</div>
                <div class="text-base md:text-lg font-black text-amber-950 bg-amber-100/70 border border-amber-300 px-3 py-1.5 rounded-xl w-full flex items-center justify-between">
                  <span>1 x Ekmek</span>
                  <button 
                    onclick="markAllOrderReady('${order.id}')"
                    class="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-black shadow-xs cursor-pointer"
                  >
                    Hazır
                  </button>
                </div>
                <div class="text-[11px] font-bold text-amber-700 mt-1">
                  Mutfak fırınından taze bekleniyor
                </div>
              </div>

              <!-- SAYAÇ VE BİLGİ -->
              <div class="px-2.5 py-1.5 bg-amber-100/70 border-t border-amber-200 flex items-center justify-between flex-shrink-0">
                <span class="text-xs font-bold text-amber-900">🍞 Ekmek Servisi</span>
                <span id="timer-${order.id}" class="text-xs px-2 py-0.5 rounded-md font-mono font-black tracking-wide bg-amber-200 text-amber-950 border border-amber-300">
                  ⏱ ${formatTime(elapsed)}
                </span>
              </div>
            </div>
          `;
        }

        const totalItems = (order.products || []).length;
        const readyItems = (order.products || []).filter(p => p.isReady).length;
        const isAllReady = totalItems > 0 && readyItems === totalItems;

        let orderTypeBadge = '';
        if (order.orderType === 'PAKET') {
          orderTypeBadge = '<span class="px-1.5 py-0.2 rounded text-[10px] font-black uppercase tracking-wider bg-purple-100 text-purple-800 border border-purple-300">PAKET</span>';
        } else if (order.orderType === 'GEL-AL') {
          orderTypeBadge = '<span class="px-1.5 py-0.2 rounded text-[10px] font-black uppercase tracking-wider bg-cyan-100 text-cyan-800 border border-cyan-300">GEL-AL</span>';
        }

        // Ürünleri sırala:
        // En üstte Pizzalar (1) -> Ortada Ortaya (2) -> En altta İçecekler (3)
        const sortedProducts = [...(order.products || [])].sort((a, b) => {
          return getProductGroup(a) - getProductGroup(b);
        });

        // Kural: Çok ürün varsa kendine ayrılan yere sığmaz, bulunduğu sütunda 2 slot kaplar (row-span-2)
        const isSpan2 = shouldCardSpanTwoRows(order);

        return `
          <div 
            id="servis-card-${order.id}" 
            class="bg-white rounded-xl border-2 transition-all shadow-sm hover:shadow-md flex flex-col justify-between overflow-hidden h-full ${
              isSpan2 ? 'row-span-2' : ''
            } ${
              isAllReady 
                ? 'border-emerald-500 bg-emerald-50/20' 
                : isUrgent 
                  ? 'border-red-500 card-urgent' 
                  : 'border-slate-200 hover:border-slate-300'
            } ${isNew ? 'order-enter' : ''}"
          >
            <!-- BAŞLIK: MASA ADI (KÜÇÜK) + ADİSYON NO (YAN YANA) + TÜMÜ HAZIR BUTONU -->
            <div class="px-2.5 py-2 bg-slate-50 border-b border-slate-200 flex-shrink-0">
              <div class="flex items-center justify-between gap-1.5">
                
                <!-- SOL: Masa Adı (küçük) & Adisyon No Yan Yana (Garson adı yok) -->
                <div class="flex items-center gap-1.5 flex-wrap min-w-0">
                  <h2 class="text-sm md:text-base font-black text-slate-900 tracking-tight leading-none truncate max-w-[130px]" title="${order.tableName}">
                    ${order.tableName}
                  </h2>
                  ${order.isAddition ? '<span class="text-sm md:text-base font-black text-rose-600 leading-none">EK</span>' : ''}
                  <span class="text-xs font-bold text-slate-500">
                    #${order.orderNumber}
                  </span>
                  ${orderTypeBadge}
                </div>

                <!-- SAĞ: MASA ADI YANINDAKİ "TÜMÜ HAZIR" BUTONU (BÜYÜTÜLDÜ) -->
                <div class="flex-shrink-0">
                  <button 
                    onclick="markAllOrderReady(${order.id})" 
                    title="Adisyo'da masayı hazır yap ve ekrandan düşür"
                    class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs md:text-sm font-black transition active:scale-95 shadow-sm flex items-center gap-1.5 border border-emerald-700/40"
                  >
                    <span class="text-xs md:text-sm font-black leading-none">✓</span>
                    <span class="leading-none">Tümü Hazır</span>
                  </button>
                </div>

              </div>

              <!-- İlerleme Çubuğu & Sayaç (Satır ve Sayaç Fontu Büyütüldü) -->
              <div class="mt-1.5 pt-1 border-t border-slate-200/80 flex items-center justify-between text-xs text-slate-600 font-bold">
                <span class="${isAllReady ? 'text-emerald-700 font-black' : ''}">
                  ${isAllReady ? '✓ TÜMÜ HAZIR' : `Hazırlık: ${readyItems}/${totalItems}`}
                </span>
                <span id="timer-${order.id}" class="text-xs md:text-sm px-2 py-0.5 rounded-md font-mono font-black tracking-wide ${
                  elapsed >= 540 ? 'bg-red-100 text-red-800 border border-red-300 animate-pulse' : elapsed >= 240 ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-slate-100 text-slate-700 border border-slate-200'
                }">
                  ⏱ ${formatTime(elapsed)}
                </span>
              </div>
            </div>

            <!-- ADİSYON NOTU (Varsa) -->
            ${order.orderNote ? `
              <div class="px-2.5 py-1 bg-amber-50 border-b border-amber-300 text-amber-950 text-xs font-black flex items-center gap-1.5 flex-shrink-0">
                <span class="text-sm">📝</span>
                <span class="truncate" title="${order.orderNote}">Adisyon Notu: ${order.orderNote}</span>
              </div>
            ` : ''}

            <!-- ÜRÜN LİSTESİ: SATIRLAR %10 BÜYÜTÜLDÜ, FONT BÜYÜTÜLDÜ, BUTON GENİŞLETİLDİ -->
            <div class="p-2 space-y-1 flex-1 overflow-y-auto bg-white">
              ${sortedProducts.map((item, index) => {
                const isReady = item.isReady;
                const currentGroup = getProductGroup(item);
                const prevGroup = index > 0 ? getProductGroup(sortedProducts[index - 1]) : null;
                const showGroupDivider = (prevGroup !== null && currentGroup !== prevGroup);

                return `
                  ${showGroupDivider ? '<div class="border-t border-dashed border-slate-200 my-1"></div>' : ''}
                  
                  <div class="py-1.5 px-2.5 rounded-lg border transition-all flex items-center justify-between gap-2 ${
                    isReady 
                      ? 'bg-emerald-50/70 border-emerald-300' 
                      : 'bg-slate-50/70 border-slate-200 hover:border-slate-300'
                  }">
                    
                    <!-- SOL: ADET VE ÜRÜN ADI (FONT BÜYÜTÜLDÜ, KATEGORİ YOK, ASLA 2 SATIR OLMAZ) -->
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                      <span class="text-xs md:text-sm font-black px-2 py-0.5 rounded flex-shrink-0 leading-none ${getQtyBadgeClass(item, isReady)}">
                        ${item.qty}x
                      </span>

                      <div class="min-w-0 flex-1">
                        <span 
                          class="text-xs md:text-sm font-bold leading-snug block truncate whitespace-nowrap ${
                            isReady ? 'line-through text-slate-400' : 'text-slate-900'
                          }"
                          title="${item.name}"
                        >
                          ${item.name}
                        </span>

                        ${item.note ? `
                          <div class="mt-0.5 inline-flex items-center gap-1 bg-rose-50 border border-rose-300 text-rose-950 px-1.5 py-0.2 rounded text-[11px] font-black tracking-tight max-w-full">
                            <span>⚠️</span>
                            <span class="truncate" title="${item.note}">${item.note}</span>
                          </div>
                        ` : ''}
                      </div>
                    </div>

                    <!-- SAĞ: TEK TEK "HAZIR" BUTONU (BÜYÜTÜLDÜ) -->
                    <div class="flex-shrink-0">
                      <button 
                        onclick="toggleProductReady(${order.id}, '${item.id}')"
                        class="px-4 py-1.5 min-w-[68px] justify-center rounded-lg font-black text-xs md:text-sm leading-none transition active:scale-95 flex items-center gap-1 shadow-sm ${
                          isReady 
                            ? 'bg-emerald-600 hover:bg-emerald-700 text-white border border-emerald-700' 
                            : 'bg-white hover:bg-emerald-600 hover:text-white text-slate-800 border border-slate-300 hover:border-emerald-600'
                        }"
                      >
                        <span class="${isReady ? 'text-sm font-black' : ''}">${isReady ? '✓' : 'Hazır'}</span>
                      </button>
                    </div>

                  </div>
                `;
              }).join('')}
            </div>

          </div>
        `;
      }).join('');
    }

    // Sayfa açıldığında önbellekteki siparişleri derhal ekrana bas (3 saatten eskileri süpür)
    try {
      const saved = localStorage.getItem('deli_servis_orders');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) {
          orders = parsed.filter(o => getOrderSeconds(o) < 10800);
          if (orders.length > 0) renderOrders();
          else localStorage.setItem('deli_servis_orders', JSON.stringify([]));
        }
      }
    } catch (e) {}

    let consecutiveZeroCount = 0;

    function processOrdersData(data) {
      if (!data) return;

      if (Array.isArray(data.preparedOrderIds)) {
        data.preparedOrderIds.forEach(id => dismissedOrders.add(String(id)));
      }

      if (Array.isArray(data.dismissedBreadIds)) {
        let breadDismissedChanged = false;
        data.dismissedBreadIds.forEach(id => {
          const sid = String(id);
          if (!dismissedBreadSet.has(sid)) {
            dismissedBreadSet.add(sid);
            breadDismissedChanged = true;
          }
        });
        if (breadDismissedChanged) {
          try {
            localStorage.setItem('deli_dismissed_bread', JSON.stringify([...dismissedBreadSet]));
          } catch (e) {}
        }
      }

      const rawServerOrders = Array.isArray(data.orders) ? data.orders : [];
      // 3 saatten (180 dakika) eski veya kapatılmış ekmek taleplerini filtrele
      const serverOrders = rawServerOrders.filter(o => {
        if (getOrderSeconds(o) >= 10800) return false;
        if (o.isBreadRequest && dismissedBreadSet.has(String(o.id))) return false;
        if (dismissedOrders.has(getOrderDismissKey(o))) return false;
        return true;
      });

      // ==========================================
      // KORUMA: Sadece sunucu Adisyo'ya hiç bağlanamadıysa ve hata varsa koru!
      // ==========================================
      const isQuota = data.isQuotaProtected || (data.status && data.status.includes('kota'));
      if (serverOrders.length === 0 && orders.length > 0) {
        if ((isQuota || data.lastSyncSuccess === false) && !data.lastSyncSuccess) {
          const statusEl = document.getElementById('sync-status');
          if (statusEl) {
            const visibleCount = orders.filter(o => !dismissedOrders.has(o.id)).length;
            if (visibleCount > 0) {
              statusEl.textContent = `Adisyo Kota Beklemede (${visibleCount} Masa Korunuyor)`;
              return;
            }
          }
        }
      }

      // ==========================================
      // KORUMA 3: LOCALSTORAGE KORUMASI
      // ==========================================
      if (serverOrders.length > 0) {
        try {
          localStorage.setItem('deli_servis_orders', JSON.stringify(serverOrders));
        } catch (e) {}
      } else if (data.lastSyncSuccess) {
        try {
          localStorage.setItem('deli_servis_orders', JSON.stringify([]));
        } catch (e) {}
      }

      const currentIds = new Set(serverOrders.map(o => o.id));
      const rawKeys = new Set(rawServerOrders.map(o => getOrderDismissKey(o)));

      if (data.lastSyncSuccess && data.hasSyncedWithAdisyo) {
        const preparedSet = new Set(Array.isArray(data.preparedOrderIds) ? data.preparedOrderIds.map(String) : []);
        dismissedOrders.forEach(dismissedKey => {
          if (!rawKeys.has(dismissedKey) && !preparedSet.has(dismissedKey)) {
            dismissedOrders.delete(dismissedKey);
          }
        });
        renderedCardIds.forEach(renderedId => {
          if (!currentIds.has(renderedId)) {
            renderedCardIds.delete(renderedId);
          }
        });
      }

      // 1. Sunucudan ve diğer cihazlardan gelen hazır ürün listesini birleştir
      const serverReadyList = Array.isArray(data.readyProductIds) ? data.readyProductIds : [];
      const now = Date.now();

      // Son 30 sn'de elle unready yapılanların süresi dolduysa temizle
      recentlyUnready.forEach((ts, id) => {
        if (now - ts > 30000) recentlyUnready.delete(id);
      });

      serverReadyList.forEach(id => {
        const sid = String(id);
        if (!recentlyUnready.has(sid)) {
          localReadySet.add(sid);
        }
      });

      // Kapanmış siparişlerin artık ekranda olmayan ürünlerini localReadySet'ten süpür
      const activePids = new Set();
      serverOrders.forEach(so => {
        (so.products || []).forEach(p => activePids.add(String(p.id)));
      });
      localReadySet.forEach(pid => {
        if (!activePids.has(pid)) localReadySet.delete(pid);
      });

      try {
        localStorage.setItem('deli_servis_ready_pids', JSON.stringify([...localReadySet]));
      } catch (e) {}

      // 2. Tüm ürünlerin hazır durumunu kalıcı yerel set ile senkronize et (ASLA geriye dönmez!)
      serverOrders.forEach(so => {
        so.secondsElapsed = getOrderSeconds(so);
        (so.products || []).forEach(p => {
          const pid = String(p.id);
          if (localReadySet.has(pid)) {
            p.isReady = true;
          } else if (p.isReady && !recentlyUnready.has(pid)) {
            localReadySet.add(pid);
          }
        });
      });

      const statusEl = document.getElementById('sync-status');
      if (statusEl) {
        const visibleCount = serverOrders.filter(o => !dismissedOrders.has(getOrderDismissKey(o))).length;
        const syncTime = data.lastSyncTime || 'Canlı';
        statusEl.textContent = `Adisyo Canlı (${visibleCount} Masa • ${syncTime})`;
      }

      // KORUMA 4: KISMİ VERİ KORUMASI (SADECE sunucu Adisyo ile henüz HİÇ senkronize olmamışsa)
      let finalOrders = [...serverOrders];
      if (data.hasSyncedWithAdisyo === false && data.lastSyncSuccess === false) {
        const existingAdisyoOrders = orders.filter(o => !o.isBreadRequest && !dismissedOrders.has(getOrderDismissKey(o)));
        if (existingAdisyoOrders.length > 0) {
          const serverIds = new Set(serverOrders.map(o => o.id));
          existingAdisyoOrders.forEach(eo => {
            if (!serverIds.has(eo.id)) {
              finalOrders.push(eo);
            }
          });
        }
      }

      finalOrders = finalOrders.filter(o => {
        if (o.isBreadRequest && dismissedBreadSet.has(String(o.id))) return false;
        if (dismissedOrders.has(getOrderDismissKey(o))) return false;
        return true;
      });

      finalOrders.sort((a, b) => new Date(a.insertDate) - new Date(b.insertDate));

      const newSig = computeOrdersSignature(finalOrders);
      const dataChanged = (newSig !== lastRenderSignature);

      orders = finalOrders;
      previousOrderIds = new Set(finalOrders.map(o => o.id));
      isFirstLoad = false;

      if (dataChanged) {
        lastRenderSignature = newSig;
        renderOrders();
      }
    }

    async function syncOrders() {
      try {
        const activeBread = orders.filter(o => o.isBreadRequest && !dismissedBreadSet.has(String(o.id)));
        const headers = { 
          'Cache-Control': 'no-cache', 
          'Pragma': 'no-cache',
          'x-ready-ids': [...localReadySet].join(',')
        };
        if (activeBread.length > 0) {
          headers['x-bread-requests'] = encodeURIComponent(JSON.stringify(activeBread));
        }
        const res = await fetch('/api/orders?_t=' + Date.now(), {
          cache: 'no-store',
          headers
        });
        if (!res.ok) {
          // 429 veya hata durumunda mevcut siparişleri koru
          const statusEl = document.getElementById('sync-status');
          if (statusEl) {
            const visibleCount = orders.filter(o => !dismissedOrders.has(o.id)).length;
            statusEl.textContent = orders.length > 0 ? `Adisyo Beklemede (${visibleCount} Masa Korunuyor)` : 'Bağlantı Bekleniyor...';
          }
          return;
        }
        const data = await res.json();
        processOrdersData(data);
      } catch (e) {
        const statusEl = document.getElementById('sync-status');
        if (statusEl) {
          const visibleCount = orders.filter(o => !dismissedOrders.has(o.id)).length;
          statusEl.textContent = orders.length > 0 ? `Adisyo Beklemede (${visibleCount} Masa Korunuyor)` : 'Bağlantı Bekleniyor...';
        }
      }
    }

    // ==========================================
    // EKMEK TALEBİ (Tek Tıkla, Kutusuz Doğrudan Mutfak Ekranının En Başına Düşer)
    // ==========================================
    async function submitBreadRequest() {
      const btn = document.getElementById('btn-bread-request');
      const btnText = document.getElementById('btn-bread-text');
      
      // Butonda anlık görsel geri bildirim ver
      if (btnText) btnText.textContent = 'İletildi ✓';
      if (btn) btn.classList.add('bg-emerald-600', 'border-emerald-700');

      setTimeout(() => {
        if (btnText) btnText.textContent = 'Ekmek Talebi';
        if (btn) btn.classList.remove('bg-emerald-600', 'border-emerald-700');
      }, 1500);

      try {
        const res = await fetch('/api/orders?action=create-bread-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tableName: 'EKMEK TALEBİ' })
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.order) {
            if (!orders.some(o => o.id === data.order.id)) {
              orders.unshift(data.order);
              try {
                localStorage.setItem('deli_servis_orders', JSON.stringify(orders));
              } catch (e) {}
              renderOrders();
            }
          }
          if (data && Array.isArray(data.orders)) {
            processOrdersData(data);
          }
        }
      } catch (e) {
        console.error('Bread request error:', e);
      }
      setTimeout(syncOrders, 300);
    }

    syncOrders();
    setInterval(syncOrders, 3000);

    setInterval(() => {
      orders.forEach(order => {
        const elapsed = getOrderSeconds(order);
        order.secondsElapsed = elapsed;
        const timerEl = document.getElementById(`timer-${order.id}`);
        if (timerEl) {
          timerEl.textContent = `⏱ ${formatTime(elapsed)}`;
          if (elapsed >= 540) {
            timerEl.className = "text-xs md:text-sm px-2 py-0.5 rounded-md font-mono font-black tracking-wide bg-red-100 text-red-800 border border-red-300 animate-pulse";
          } else if (elapsed >= 240) {
            timerEl.className = "text-xs md:text-sm px-2 py-0.5 rounded-md font-mono font-black tracking-wide bg-amber-100 text-amber-900 border border-amber-300";
          } else {
            timerEl.className = "text-xs md:text-sm px-2 py-0.5 rounded-md font-mono font-black tracking-wide bg-slate-100 text-slate-700 border border-slate-200";
          }
        }
      });
    }, 1000);

    async function manualSync() {
      const statusEl = document.getElementById('sync-status');
      if (statusEl) statusEl.textContent = 'Adisyo Taranıyor...';
      try {
        const res = await fetch('/api/orders?action=sync-now', { 
          method: 'POST',
          headers: { 'Cache-Control': 'no-cache' }
        });
        if (res.ok) {
          const data = await res.json();
          processOrdersData(data);
          return;
        }
      } catch (e) {}
      await syncOrders();
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
