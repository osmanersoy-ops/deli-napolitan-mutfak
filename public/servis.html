<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deli Napolitan - Servis & Expo Ekranı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-urgent {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.35); }
      50% { border-color: #dc2626; box-shadow: 0 0 25px rgba(220, 38, 38, 0.6); }
    }
    .card-urgent {
      animation: pulse-urgent 2s infinite ease-in-out;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .order-enter {
      animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .order-exit {
      transform: scale(0.92) translateY(24px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen font-sans antialiased select-none flex flex-col">

  <!-- TOP BAR (BEYAZ TEMA) -->
  <header class="px-5 py-2.5 flex items-center justify-between sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
    <div class="flex items-center gap-3">
      <a href="/" title="Ana Sayfaya Dön" class="text-lg font-black text-amber-600 hover:text-amber-500 transition flex items-center gap-2 tracking-tight">
        <span>🛎️</span> DELI NAPOLITAN
      </a>
      <span class="text-xs font-bold text-slate-700 uppercase tracking-wider bg-slate-100 px-2 py-0.5 rounded-md border border-slate-300">
        Servis & Expo
      </span>
      <div class="flex items-center gap-1.5 bg-emerald-50 border border-emerald-300 px-2.5 py-0.5 rounded-full text-emerald-800 text-xs font-bold shadow-xs">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="sync-status">Adisyo Canlı</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <a href="/mutfak" title="Mutfak Fırın Ekranına Geç" class="flex items-center gap-1.5 px-2.5 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-bold transition active:scale-95 shadow-sm">
        <span>🍕</span>
        <span>Mutfak Ekranı</span>
      </a>
      <button onclick="manualSync()" title="Şimdi Yenile" class="flex items-center gap-1 px-2.5 py-1.5 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg text-slate-700 text-xs font-bold transition active:scale-95 shadow-xs">
        <span>🔄</span>
        <span>Yenile</span>
      </button>
      <button onclick="toggleSound()" id="sound-btn" title="Sesli Bildirim" class="flex items-center gap-1 px-2.5 py-1.5 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg text-slate-700 text-xs font-bold transition active:scale-95 shadow-xs">
        <span id="sound-icon">🔔</span>
        <span id="sound-text">Ses Açık</span>
      </button>
      <button onclick="toggleFullScreen()" title="Tam Ekran Modu" class="flex items-center gap-1 px-2.5 py-1.5 bg-slate-800 hover:bg-slate-900 rounded-lg text-white text-xs font-bold transition active:scale-95 shadow-sm">
        <span>⛶</span>
        <span>Tam Ekran</span>
      </button>
    </div>
  </header>

  <!-- MAIN KDS GRID: 4 SÜTUN DÜZENİ (4 adisyondan sonra alt satıra geçer, ekrana 8 adisyon rahatça sığar) -->
  <main class="flex-1 px-3.5 py-3 overflow-y-auto">
    <div id="orders-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-4 2xl:grid-cols-4 gap-3 items-start">
      <!-- Tüm ürünleriyle adisyon kartları 4 sütun halinde buraya basılır -->
    </div>

    <!-- Boş Durum -->
    <div id="empty-state" class="hidden text-center py-32">
      <div class="text-6xl mb-3">🛎️</div>
      <h3 class="text-2xl font-black text-slate-800">Bekleyen Servis Adisyonu Yok</h3>
      <p class="text-sm text-slate-500 mt-1">Adisyo'dan sipariş girildiğinde buraya anında düşecektir.</p>
    </div>
  </main>

  <script>
    let soundEnabled = true;
    let orders = [];
    let previousOrderIds = new Set();
    let isFirstLoad = true;
    let lastRenderSignature = null;
    const localReadyOverrides = new Map();
    const renderedCardIds = new Set();
    const dismissedOrders = new Set();

    function playKitchenChime() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(659.25, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.8);
      } catch (e) {}
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function getOrderSeconds(order) {
      if (!order.insertDate) return 0;
      try {
        let dateStr = order.insertDate;
        if (!dateStr.includes('+') && !dateStr.includes('Z')) {
          dateStr += '+03:00';
        }
        const dt = new Date(dateStr);
        return Math.max(0, Math.floor((Date.now() - dt.getTime()) / 1000));
      } catch (e) {
        return order.secondsElapsed || 0;
      }
    }

    // Ürün Sıralama Grubu:
    // 1: Pizzalar (En Üstte)
    // 2: Ortaya (Yan ürünler, salatalar, mezeler, tatlılar vb. - Ortada)
    // 3: İçecekler (En Altta)
    function getProductGroup(item) {
      const cat = (item.category || '').toLowerCase();
      const name = (item.name || '').toLowerCase();

      // 1. Pizzalar
      if (
        item.isPizza || 
        cat.includes('pizza') || 
        name.includes('pizza') || 
        name.includes('calzone') || 
        name.includes('margherita') || 
        name.includes('napolitan')
      ) {
        return 1;
      }

      // 3. İçecekler
      if (
        cat.includes('içecek') || cat.includes('icecek') || cat.includes('mesrubat') || cat.includes('meşrubat') ||
        cat.includes('kahve') || cat.includes('su') || cat.includes('bira') || cat.includes('şarap') || cat.includes('sarap') ||
        cat.includes('kokteyl') || cat.includes('alkol') || cat.includes('soda') || cat.includes('ayran') ||
        name.includes('kola') || name.includes('cola') || name.includes('fanta') || name.includes('sprite') ||
        name.includes('ayran') || name.includes('soda') || name.includes('su') ||
        name.includes('bira') || name.includes('çay') || name.includes('cay') || name.includes('kahve') || name.includes('espresso')
      ) {
        return 3;
      }

      // 2. Ortaya (Salata, tatlı, makarna, başlangıç vb.)
      return 2;
    }

    function computeOrdersSignature(ordersList) {
      return ordersList.map(o => {
        const pSig = (o.products || []).map(p => `${p.id}:${p.isReady ? 1 : 0}`).join(',');
        return `${o.id}_${pSig}`;
      }).join('|');
    }

    // ==========================================
    // 1. ÜRÜN HAZIR BUTONU (Tek Tek Hazırla)
    // ==========================================
    async function toggleProductReady(orderId, productId) {
      const order = orders.find(o => o.id === orderId);
      if (!order) return;
      const product = (order.products || []).find(p => String(p.id) === String(productId));
      if (!product) return;

      const newReadyState = !product.isReady;
      product.isReady = newReadyState;

      // 15 saniyelik yerel kilit (Optimistic Lock)
      localReadyOverrides.set(String(productId), {
        isReady: newReadyState,
        timestamp: Date.now()
      });

      renderOrders();

      // Sunucuya bildir (Mutfak ekranına anında yansısın)
      try {
        await fetch('/api/orders?action=toggle-ready', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId, isReady: newReadyState })
        });
      } catch (e) {}
    }

    // ==========================================
    // 2. MASA ADI YANINDAKİ "TÜMÜ HAZIR" BUTONU
    // (Adisyo'da masayı mavi yapar ve mutfaktan düşürür!)
    // ==========================================
    async function markAllOrderReady(orderId) {
      const card = document.getElementById(`servis-card-${orderId}`);
      if (card) {
        card.classList.add('order-exit');
      }

      dismissedOrders.add(orderId);

      setTimeout(() => {
        orders = orders.filter(o => o.id !== orderId);
        renderOrders();
      }, 350);

      // Adisyo'ya resmi Prepared komutu gönder (Adisyo mutfağından düşer & masa mavi olur!)
      try {
        await fetch('/api/orders?action=mark-all-ready', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId })
        });
      } catch (e) {
        console.error('Mark all ready error:', e);
      }

      setTimeout(syncOrders, 800);
    }

    // ==========================================
    // KARTLARI ÇİZ (SERVİS EKRANI - İNCE & KOMPAKT 4'LÜ SÜTUN)
    // ==========================================
    function renderOrders() {
      const container = document.getElementById('orders-grid');
      const emptyState = document.getElementById('empty-state');

      const visibleOrders = orders.filter(o => !dismissedOrders.has(o.id));

      if (!visibleOrders || visibleOrders.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      container.innerHTML = visibleOrders.map((order) => {
        const elapsed = getOrderSeconds(order);
        const isUrgent = elapsed >= 540;
        const isNew = !renderedCardIds.has(order.id);
        renderedCardIds.add(order.id);

        const totalItems = (order.products || []).length;
        const readyItems = (order.products || []).filter(p => p.isReady).length;
        const isAllReady = totalItems > 0 && readyItems === totalItems;

        let orderTypeBadge = '';
        if (order.orderType === 'PAKET') {
          orderTypeBadge = '<span class="px-1.5 py-0.2 rounded text-[10px] font-black uppercase tracking-wider bg-purple-100 text-purple-800 border border-purple-300">PAKET</span>';
        } else if (order.orderType === 'GEL-AL') {
          orderTypeBadge = '<span class="px-1.5 py-0.2 rounded text-[10px] font-black uppercase tracking-wider bg-cyan-100 text-cyan-800 border border-cyan-300">GEL-AL</span>';
        }

        // Ürünleri sırala:
        // En üstte Pizzalar (1) -> Ortada Ortaya (2) -> En altta İçecekler (3)
        const sortedProducts = [...(order.products || [])].sort((a, b) => {
          return getProductGroup(a) - getProductGroup(b);
        });

        return `
          <div 
            id="servis-card-${order.id}" 
            class="bg-white rounded-xl border-2 transition-all shadow-sm hover:shadow-md flex flex-col justify-between overflow-hidden ${
              isAllReady 
                ? 'border-emerald-500 bg-emerald-50/20' 
                : isUrgent 
                  ? 'border-red-500 card-urgent' 
                  : 'border-slate-200 hover:border-slate-300'
            } ${isNew ? 'order-enter' : ''}"
          >
            <!-- BAŞLIK: MASA ADI (KÜÇÜK) + ADİSYON NO (YAN YANA) + TÜMÜ HAZIR BUTONU -->
            <div class="px-2.5 py-2 bg-slate-50 border-b border-slate-200">
              <div class="flex items-center justify-between gap-1.5">
                
                <!-- SOL: Masa Adı (küçük) & Adisyon No Yan Yana (Garson adı yok) -->
                <div class="flex items-center gap-1.5 flex-wrap min-w-0">
                  <h2 class="text-base font-black text-slate-900 tracking-tight leading-none truncate max-w-[130px]" title="${order.tableName}">
                    ${order.tableName}
                  </h2>
                  <span class="text-xs font-bold text-slate-500">
                    #${order.orderNumber}
                  </span>
                  ${orderTypeBadge}
                </div>

                <!-- SAĞ: MASA ADI YANINDAKİ "TÜMÜ HAZIR" BUTONU -->
                <div class="flex-shrink-0">
                  <button 
                    onclick="markAllOrderReady(${order.id})" 
                    title="Adisyo'da masayı hazır yap ve ekrandan düşür"
                    class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md text-[11px] font-black transition active:scale-95 shadow-xs flex items-center gap-1 border border-emerald-700/30"
                  >
                    <span>✓</span>
                    <span>Tümü Hazır</span>
                  </button>
                </div>

              </div>

              <!-- İlerleme Çubuğu & Sayaç -->
              <div class="mt-1.5 flex items-center justify-between text-[11px] text-slate-600 font-bold border-t border-slate-200/80 pt-1">
                <span class="${isAllReady ? 'text-emerald-700 font-black' : ''}">
                  ${isAllReady ? '✓ TÜMÜ HAZIR' : `Hazırlık: ${readyItems}/${totalItems}`}
                </span>
                <span id="timer-${order.id}" class="text-[11px] px-1.5 py-0.2 rounded font-mono font-bold ${
                  elapsed >= 540 ? 'bg-red-100 text-red-800 border border-red-300 animate-pulse' : elapsed >= 240 ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-slate-100 text-slate-700 border border-slate-200'
                }">
                  ⏱ ${formatTime(elapsed)}
                </span>
              </div>
            </div>

            <!-- ÜRÜN LİSTESİ: İNCE SATIRLAR, ASLA 2 SATIR OLMAYACAK (TRUNCATE İLE NOKTALI KESİM) -->
            <div class="p-2 space-y-1 flex-1 bg-white">
              ${sortedProducts.map((item, index) => {
                const isReady = item.isReady;
                const currentGroup = getProductGroup(item);
                const prevGroup = index > 0 ? getProductGroup(sortedProducts[index - 1]) : null;
                const showGroupDivider = (prevGroup !== null && currentGroup !== prevGroup);

                return `
                  ${showGroupDivider ? '<div class="border-t border-dashed border-slate-200 my-1"></div>' : ''}
                  
                  <div class="py-1 px-2 rounded-lg border transition-all flex items-center justify-between gap-1.5 ${
                    isReady 
                      ? 'bg-emerald-50/70 border-emerald-300' 
                      : 'bg-slate-50/70 border-slate-200 hover:border-slate-300'
                  }">
                    
                    <!-- SOL: ADET VE ÜRÜN ADI (KATEGORİ YOK, ASLA 2 SATIR OLMAZ, NOKTALI KESİLİR) -->
                    <div class="flex items-center gap-1.5 flex-1 min-w-0">
                      <span class="text-xs font-black px-1.5 py-0.5 rounded flex-shrink-0 leading-none ${
                        isReady 
                          ? 'bg-emerald-100 text-emerald-800 border border-emerald-300 line-through' 
                          : 'bg-amber-100 text-amber-900 border border-amber-300'
                      }">
                        ${item.qty}x
                      </span>

                      <div class="min-w-0 flex-1">
                        <span 
                          class="text-xs font-bold leading-tight block truncate whitespace-nowrap ${
                            isReady ? 'line-through text-slate-400' : 'text-slate-900'
                          }"
                          title="${item.name}"
                        >
                          ${item.name}
                        </span>

                        ${item.note ? `
                          <span class="text-[10px] font-bold text-rose-700 truncate block whitespace-nowrap leading-none mt-0.5" title="${item.note}">
                            ⚠️ ${item.note}
                          </span>
                        ` : ''}
                      </div>
                    </div>

                    <!-- SAĞ: TEK TEK "HAZIR" BUTONU (KOMPAKT) -->
                    <div class="flex-shrink-0">
                      <button 
                        onclick="toggleProductReady(${order.id}, '${item.id}')"
                        class="px-2 py-0.5 rounded-md font-bold text-[11px] leading-tight transition active:scale-95 flex items-center gap-1 shadow-xs ${
                          isReady 
                            ? 'bg-emerald-600 hover:bg-emerald-700 text-white border border-emerald-700' 
                            : 'bg-white hover:bg-emerald-600 hover:text-white text-slate-700 border border-slate-300 hover:border-emerald-600'
                        }"
                      >
                        <span>${isReady ? '✓' : 'Hazır'}</span>
                      </button>
                    </div>

                  </div>
                `;
              }).join('')}
            </div>

          </div>
        `;
      }).join('');
    }

    async function syncOrders() {
      try {
        const res = await fetch('/api/orders?_t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
        });
        if (!res.ok) throw new Error('API Hatası');
        const data = await res.json();
        const serverOrders = data.orders || [];

        const currentIds = new Set(serverOrders.map(o => o.id));

        let hasNewOrder = false;
        serverOrders.forEach(so => {
          if (!previousOrderIds.has(so.id) && !isFirstLoad) {
            hasNewOrder = true;
          }
        });

        if (hasNewOrder) {
          playKitchenChime();
        }

        dismissedOrders.forEach(dismissedId => {
          if (!currentIds.has(dismissedId)) {
            dismissedOrders.delete(dismissedId);
          }
        });
        renderedCardIds.forEach(renderedId => {
          if (!currentIds.has(renderedId)) {
            renderedCardIds.delete(renderedId);
          }
        });

        const now = Date.now();
        serverOrders.forEach(so => {
          so.secondsElapsed = getOrderSeconds(so);
          (so.products || []).forEach(p => {
            const pid = String(p.id);
            if (localReadyOverrides.has(pid)) {
              const item = localReadyOverrides.get(pid);
              if (now - item.timestamp < 15000) {
                p.isReady = item.isReady;
              } else {
                localReadyOverrides.delete(pid);
              }
            }
          });
        });

        const statusEl = document.getElementById('sync-status');
        if (statusEl) {
          const visibleCount = serverOrders.filter(o => !dismissedOrders.has(o.id)).length;
          const syncTime = data.lastSyncTime || 'Canlı';
          statusEl.textContent = `Adisyo Canlı (${visibleCount} Masa • ${syncTime})`;
        }

        const newSig = computeOrdersSignature(serverOrders);
        const dataChanged = (newSig !== lastRenderSignature);

        orders = serverOrders;
        previousOrderIds = currentIds;
        isFirstLoad = false;

        if (dataChanged) {
          lastRenderSignature = newSig;
          renderOrders();
        }
      } catch (e) {
        const statusEl = document.getElementById('sync-status');
        if (statusEl) {
          statusEl.textContent = 'Bağlantı Bekleniyor...';
        }
      }
    }

    syncOrders();
    setInterval(syncOrders, 1500);

    setInterval(() => {
      orders.forEach(order => {
        const elapsed = getOrderSeconds(order);
        order.secondsElapsed = elapsed;
        const timerEl = document.getElementById(`timer-${order.id}`);
        if (timerEl) {
          timerEl.textContent = `⏱ ${formatTime(elapsed)}`;
        }
      });
    }, 1000);

    async function manualSync() {
      const statusEl = document.getElementById('sync-status');
      if (statusEl) statusEl.textContent = 'Adisyo Taranıyor...';
      try {
        await fetch('/api/orders?action=sync-now', { method: 'POST' });
      } catch (e) {}
      await syncOrders();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('sound-icon');
      const text = document.getElementById('sound-text');
      if (soundEnabled) {
        icon.textContent = '🔔';
        text.textContent = 'Ses Açık';
        playKitchenChime();
      } else {
        icon.textContent = '🔕';
        text.textContent = 'Sessiz';
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
